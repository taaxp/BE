<title>BE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone-width column on a warm gradient, frosted cards in a two-column bento,
   a floating ink tab bar. System type, BE red used sparingly. */
:root {
  --sky-a: #FFD9B3; --sky-b: #FFC9DB; --ground: #FBF7F8;
  --ink: #141216; --muted: #6E686D; --faint: #9A9398;
  --glass: rgba(255, 255, 255, 0.62); --glass-hi: rgba(255, 255, 255, 0.9); --edge: rgba(255, 255, 255, 0.8);
  --track: rgba(20, 18, 22, 0.08); --hatch: rgba(20, 18, 22, 0.28);
  --pill: #141216; --pill-fg: #FFFFFF; --pill-dim: rgba(255, 255, 255, 0.55);
  --brand: #F50C45; --brand-2: #FF5C7A;
  --good: #1D9A4A; --warn: #D96500; --bad: #D23A3A;
  --steps: #E8503A; --water: #1E8BFF; --heart: #FF6B2C; --cal: #9A5BF5; --sleep: #5A57E0;
  --hrv: #E0336A; --o2: #12A0B0; --vo2: #2DA85A; --weight: #8C4FD9;
  --r-move: #F07A8A; --r-move-2: #F9B4A8; --r-exer: #5DBE9A; --r-exer-2: #A8E3C6; --r-stand: #6FA8E8; --r-stand-2: #B4D4F7;
  --s-awake: #F2A08C; --s-rem: #6FC3EC; --s-core: #6E8BEA; --s-deep: #5844C2;
  --frame: #1B1A1D;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 26px; --spring: cubic-bezier(.2, 1.25, .35, 1); --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-a: #42200F; --sky-b: #441230; --ground: #0C0A0C; --ink: #F6F1F2; --muted: #A79FA5; --faint: #7D767B;
    --glass: rgba(42, 36, 40, 0.66); --glass-hi: rgba(56, 48, 53, 0.94); --edge: rgba(255, 255, 255, 0.09);
    --track: rgba(246, 241, 242, 0.12); --hatch: rgba(246, 241, 242, 0.32);
    --pill: #1F1B20; --pill-fg: #F6F1F2; --pill-dim: rgba(246, 241, 242, 0.5);
    --brand: #FF2A5C; --brand-2: #FF6D88; --good: #3DD26B; --warn: #FF9A3D; --bad: #FF6B6B;
    --r-move: #FF8C9A; --r-move-2: #FFB9AE; --r-exer: #6FD3AC; --r-exer-2: #B0EED3; --r-stand: #84B8F2; --r-stand-2: #BCDCFA;
    --s-awake: #F7AE9B; --s-rem: #7FD0F5; --s-core: #8AA2F5; --s-deep: #7A68E0; --frame: #2B282C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-a: #42200F; --sky-b: #441230; --ground: #0C0A0C; --ink: #F6F1F2; --muted: #A79FA5; --faint: #7D767B;
  --glass: rgba(42, 36, 40, 0.66); --glass-hi: rgba(56, 48, 53, 0.94); --edge: rgba(255, 255, 255, 0.09);
  --track: rgba(246, 241, 242, 0.12); --hatch: rgba(246, 241, 242, 0.32);
  --pill: #1F1B20; --pill-fg: #F6F1F2; --pill-dim: rgba(246, 241, 242, 0.5);
  --brand: #FF2A5C; --brand-2: #FF6D88; --good: #3DD26B; --warn: #FF9A3D; --bad: #FF6B6B;
  --r-move: #FF8C9A; --r-move-2: #FFB9AE; --r-exer: #6FD3AC; --r-exer-2: #B0EED3; --r-stand: #84B8F2; --r-stand-2: #BCDCFA;
  --s-awake: #F7AE9B; --s-rem: #7FD0F5; --s-core: #8AA2F5; --s-deep: #7A68E0; --frame: #2B282C; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-block: 16px; }
.caption { font-size: 13px; color: var(--muted); text-align: center; max-width: 38rem; line-height: 1.45; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.phone { position: relative; width: min(100%, 402px); height: min(874px, calc(100% - 56px)); border-radius: 56px; border: 10px solid var(--frame);
  overflow: hidden; isolation: isolate; background: var(--ground); box-shadow: 0 40px 90px rgba(40, 10, 20, 0.22); }
@media (max-width: 520px) {
  .stage { padding-block: 0; gap: 0; }
  .caption { display: none; }
  .phone { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
}
.sky { position: absolute; inset: -20%; z-index: -1; pointer-events: none;
  background: radial-gradient(42% 30% at 16% 10%, var(--sky-a), transparent 70%), radial-gradient(40% 32% at 90% 28%, var(--sky-b), transparent 70%),
    radial-gradient(46% 30% at 28% 80%, var(--sky-b), transparent 72%), radial-gradient(36% 26% at 86% 94%, var(--sky-a), transparent 70%), var(--ground);
  animation: drift 30s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate3d(-4%, 3%, 0) rotate(5deg); } }

.screen { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) 116px; display: flex; flex-direction: column; gap: 12px; }
.view > * { min-width: 0; }
.view:focus { outline: none; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; }
.brand img { width: 34px; height: 34px; display: block; filter: drop-shadow(0 4px 10px rgba(245, 12, 69, 0.28)); }
.brand b { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
.data-chip { display: flex; align-items: center; gap: 7px; border: 1px solid var(--edge); background: var(--glass-hi); border-radius: 999px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.data-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.data-chip i.stale { background: var(--warn); }
h1 { font-size: 40px; font-weight: 750; letter-spacing: -0.04em; line-height: 1; text-wrap: balance; margin-top: 6px; }
h1 .soft { color: var(--muted); }
h2.section { font-size: 13px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 6px 4px 0; }
.name-btn { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--brand) 55%, transparent); text-decoration-thickness: 3px; text-underline-offset: 6px; }

/* Cards */
.bento { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.card { position: relative; background: var(--glass); border: 1px solid var(--edge); border-radius: var(--r); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px;
  text-align: left; backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); transition: transform .25s var(--spring); }
.card[data-metric] { cursor: pointer; }
.card[data-metric]:active { transform: scale(0.98); }
.span2 { grid-column: 1 / -1; }
.tall { grid-row: span 2; }
.ch { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; min-width: 0; }
.ch > span:not(.end) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch svg { width: 18px; height: 18px; flex: none; }
.ch .end { margin-left: auto; color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.num { white-space: nowrap; font-size: 32px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.num small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: -0.01em; margin-left: 3px; }
.vs { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vs b { font-weight: 650; }
.up-good, .down-good { color: var(--good); } .up-bad, .down-bad { color: var(--warn); }
.grow { flex: 1; }
.coach { display: flex; flex-direction: column; gap: 2px; }
.coach b { font-size: 12.5px; font-weight: 650; }
.coach span { font-size: 12.5px; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.t-positive { color: var(--good); } .t-neutral { color: var(--muted); } .t-attention { color: var(--warn); }
.track { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: 3px; transition: width .8s var(--ease); }
.empty-val { color: var(--faint); }

/* Greeting + score */
.score-card { flex-direction: row; align-items: center; gap: 14px; padding: 12px 14px; }
.ring { position: relative; flex: none; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.arc { transition: stroke-dasharray 1.1s var(--ease); }
.score-card p { font-size: 14px; line-height: 1.4; color: var(--muted); }
.score-card p strong { color: var(--ink); }
details.how { font-size: 13px; color: var(--muted); }
details.how summary { cursor: pointer; font-weight: 600; color: var(--ink); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary::after { content: "›"; transition: transform .2s; }
details.how[open] summary::after { transform: rotate(90deg); }
.how-grid { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.how-grid span:nth-child(even) { text-align: right; color: var(--ink); font-weight: 600; }

/* Date strip */
.dates { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 4px; }
.dates::-webkit-scrollbar { display: none; }
.date { flex: none; width: 50px; height: 58px; border-radius: 29px; border: 1px solid var(--edge); background: var(--glass); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  cursor: pointer; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: background .35s var(--ease), color .35s, width .45s var(--spring); }
.date b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.date span { font-size: 11px; color: var(--muted); }
.date[aria-pressed="true"] { background: var(--pill); color: var(--pill-fg); width: 72px; border-color: transparent; }
.date[aria-pressed="true"] span { color: var(--pill-dim); }
.date:disabled { opacity: .45; cursor: default; }

/* Activity bars */
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 118px; margin-top: 2px; position: relative; }
.bar { display: flex; flex-direction: column; align-items: center; height: 100%; gap: 6px; }
.bar .plot { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.bar .col { width: 100%; max-width: 40px; border-radius: 13px; background: repeating-linear-gradient(135deg, var(--hatch) 0 1.5px, transparent 1.5px 6px); box-shadow: inset 0 0 0 1px var(--hatch); transform-origin: bottom; }
.bar.met .col { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--steps) 55%, transparent) 0 1.5px, transparent 1.5px 6px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--steps) 60%, transparent); }
.bar.sel .col { background: var(--pill); box-shadow: none; }
.bar.none .col { background: none; box-shadow: inset 0 0 0 1px var(--track); }
.bar span { font-size: 11px; line-height: 16px; color: var(--muted); }
.bar.sel span { color: var(--ink); font-weight: 650; }
.goal-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--muted); opacity: .55; pointer-events: none; }
.goal-line em { position: absolute; right: 0; top: -16px; font-size: 10px; font-style: normal; color: var(--muted); }

/* Water glass */
.water-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.glass { width: 56px; height: 86px; flex: none; overflow: visible; }
.glass .wave { animation: wave 2.8s linear infinite; }
@keyframes wave { to { transform: translateX(-30px); } }

/* Heart */
.ecg { width: 100%; height: 112px; display: block; }
.beat { display: inline-flex; transform-origin: 50% 60%; animation: lubdub var(--p) linear infinite; animation-delay: var(--o); }
@keyframes lubdub { 0% { transform: scale(1); } 6% { transform: scale(1.22); } 12% { transform: scale(1.02); } 18% { transform: scale(1.14); } 30%, 100% { transform: scale(1); } }
.hr-range { display: flex; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hr-range b { color: var(--ink); font-weight: 650; }

/* Rings */
.ring-row { display: flex; align-items: center; gap: 18px; }
.rings { width: 108px; height: 108px; flex: none; animation: breathe 6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.035); } }
.ring-meta { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ring-line .top2 { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; gap: 6px; }
.ring-line .top2 span:first-child { font-weight: 600; }
.ring-line .top2 span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
.soft-track { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 5px; }
.soft-track i { display: block; height: 100%; border-radius: 3px; transition: width 1.2s var(--ease); }

/* Sleep */
.sleep-top { display: flex; align-items: center; gap: 14px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; flex: 1; min-width: 0; }
.facts div { display: flex; flex-direction: column; min-width: 0; }
.facts b { font-size: 15.5px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.facts span { font-size: 11px; color: var(--muted); }
.hypno { width: 100%; height: auto; display: block; }
.hypno text { font-size: 9px; fill: var(--muted); font-family: var(--font); }
.stages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stage { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; }
.stage .k { display: flex; align-items: center; gap: 5px; color: var(--muted); font-weight: 600; }
.stage .k i { width: 8px; height: 8px; border-radius: 2px; }
.stage b { font-size: 14.5px; font-weight: 650; font-variant-numeric: tabular-nums; }

/* Lists */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.row + .row { border-top: 1px solid var(--track); }
.row .ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; color: #fff; }
.row .ico svg { width: 18px; height: 18px; }
.row .rt { font-size: 15px; font-weight: 600; }
.row .rs { font-size: 12px; color: var(--muted); line-height: 1.35; }
.row .end { margin-left: auto; font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Ask coach */
.ask-field { display: flex; align-items: center; gap: 10px; width: 100%; border: 1px solid var(--edge); background: var(--glass-hi); border-radius: 18px; padding: 12px 12px 12px 14px; font-size: 15px; color: var(--muted); cursor: pointer; text-align: left; }
.go { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--pill); color: var(--pill-fg); display: grid; place-items: center; flex: none; }
.go svg { width: 16px; height: 16px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--edge); background: var(--glass-hi); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 550; cursor: pointer; white-space: nowrap; }
.orb { width: 28px; height: 28px; border-radius: 50%; flex: none; background: conic-gradient(var(--brand), var(--sky-a), var(--brand-2), var(--sky-b), var(--brand)); animation: spin 8s linear infinite; position: relative; }
.orb::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--glass-hi); }
@keyframes spin { to { transform: rotate(360deg); } }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 20px; font-size: 15px; line-height: 1.42; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--pill); color: var(--pill-fg); border-bottom-right-radius: 6px; }
.msg.bot { align-self: flex-start; background: var(--glass); border: 1px solid var(--edge); border-bottom-left-radius: 6px; }
.msg .meta { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); white-space: normal; }
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: dot 1.2s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 30% { transform: translateY(-5px); opacity: 1; } 0%, 60%, 100% { opacity: .5; } }
.chat-log { display: flex; flex-direction: column; gap: 10px; min-height: 240px; }
.composer { display: flex; gap: 8px; align-items: flex-end; position: sticky; bottom: 0; background: var(--glass-hi); padding-top: 8px; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--edge); background: var(--glass); border-radius: 20px; padding: 10px 14px; font-size: 16px; max-height: 110px; }
.insight { background: var(--glass); border: 1px solid var(--edge); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; align-self: stretch; }
.insight b { font-size: 15px; } .insight p { font-size: 14px; line-height: 1.4; } .insight .do { font-size: 13px; color: var(--muted); } .insight .do strong { color: var(--brand); }

/* Buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 20px; padding: 15px; font-size: 16px; font-weight: 650; cursor: pointer; transition: transform .25s var(--spring); text-align: center; }
.btn:active { transform: scale(0.97); }
.btn svg { width: 20px; height: 20px; }
.btn.ink { background: var(--pill); color: var(--pill-fg); }
.btn.glass { background: var(--glass-hi); color: var(--ink); border: 1px solid var(--edge); }
.btn.brand { background: var(--brand); color: #fff; }
.btn.danger { background: none; color: var(--bad); border: 1px solid var(--track); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--track); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 15px; height: 15px; }
.note { font-size: 13px; color: var(--muted); line-height: 1.45; }
.lab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.p { font-size: 15.5px; line-height: 1.45; }

/* Import */
.hero-import { align-items: stretch; gap: 14px; padding: 20px 18px; }
.drop { border: 2px dashed color-mix(in srgb, var(--brand) 45%, transparent); border-radius: 22px; padding: 22px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center;
  background: color-mix(in srgb, var(--brand) 4%, transparent); transition: background .2s, border-color .2s; }
.drop.over { background: color-mix(in srgb, var(--brand) 12%, transparent); border-color: var(--brand); }
.drop svg { width: 44px; height: 44px; color: var(--brand); }
.steps-list { display: flex; flex-direction: column; gap: 10px; counter-reset: s; margin: 0; padding: 0; }
.steps-list li { list-style: none; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 14.5px; line-height: 1.4; }
.steps-list li::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--pill); color: var(--pill-fg); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.assure { display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.assure div { display: flex; gap: 8px; align-items: flex-start; }
.assure svg { width: 18px; height: 18px; flex: none; color: var(--good); margin-top: 1px; }
.progress { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 10px 0; }
.progress .bigpct { font-size: 34px; font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

/* Snap */
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; padding: 4px; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 10px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; transition: color .3s; }

<script>
// Apple Health export parser. Runs inside a Web Worker (see app.js), or in Node for tests.
//
// Input: the export.zip from Health → profile → Export All Health Data, or the export.xml inside it.
// Output: compact daily aggregates. Raw records never leave this function.
//
// The whole file is streamed: the zip is read through its central directory with Blob.slice,
// the export.xml entry is inflated with DecompressionStream('deflate-raw'), and the XML is scanned
// chunk by chunk. Nothing is uploaded anywhere.

/* eslint-disable no-restricted-globals */
function beParserModule(scope) {
  const DAY_MS = 86400000;
  const KEEP_DAYS = 400; // daily history kept, counted back from the export date
  const STAGE_NIGHTS = 21; // nights kept with full stage segments for the hypnogram

  // Cumulative types: deduplicated by keeping, for each hour, the largest total from any one source.
  // This mirrors what Apple Health shows when an Apple Watch and a Fitbit both record steps.
  const SUM = {
    HKQuantityTypeIdentifierStepCount: 'steps',
    HKQuantityTypeIdentifierDistanceWalkingRunning: 'distanceKm',
    HKQuantityTypeIdentifierFlightsClimbed: 'flights',
    HKQuantityTypeIdentifierActiveEnergyBurned: 'activeKcal',
    HKQuantityTypeIdentifierAppleExerciseTime: 'exerciseMin',
    HKQuantityTypeIdentifierDietaryWater: 'waterL',
    HKQuantityTypeIdentifierDietaryEnergyConsumed: 'kcal',
    HKQuantityTypeIdentifierDietaryProtein: 'proteinG',
    HKQuantityTypeIdentifierDietaryCarbohydrates: 'carbsG',
    HKQuantityTypeIdentifierDietaryFatTotal: 'fatG',
  };
  // Discrete types: daily mean of all readings.
  const MEAN = {
    HKQuantityTypeIdentifierRestingHeartRate: 'rhr',
    HKQuantityTypeIdentifierHeartRateVariabilitySDNN: 'hrv',
    HKQuantityTypeIdentifierOxygenSaturation: 'spo2',
    HKQuantityTypeIdentifierRespiratoryRate: 'resp',
    HKQuantityTypeIdentifierWalkingHeartRateAverage: 'walkHr',
    HKQuantityTypeIdentifierAppleSleepingWristTemperature: 'wristTemp',
  };
  // Last reading of the day.
  const LAST = {
    HKQuantityTypeIdentifierVO2Max: 'vo2',
    HKQuantityTypeIdentifierBodyMass: 'weightKg',
    HKQuantityTypeIdentifierBodyFatPercentage: 'bodyFat',
    HKQuantityTypeIdentifierHeight: 'heightCm',
  };
  const HR = 'HKQuantityTypeIdentifierHeartRate';
  const SLEEP = 'HKCategoryTypeIdentifierSleepAnalysis';
  const MINDFUL = 'HKCategoryTypeIdentifierMindfulSession';
  const EVENTS = {
    HKCategoryTypeIdentifierHighHeartRateEvent: 'highHr',
    HKCategoryTypeIdentifierLowHeartRateEvent: 'lowHr',
    HKCategoryTypeIdentifierIrregularHeartRhythmEvent: 'irregular',
  };
  const STAGE = {
    HKCategoryValueSleepAnalysisAsleepCore: 'core',
    HKCategoryValueSleepAnalysisAsleepDeep: 'deep',
    HKCategoryValueSleepAnalysisAsleepREM: 'rem',
    HKCategoryValueSleepAnalysisAsleepUnspecified: 'asleep',
    HKCategoryValueSleepAnalysisAsleep: 'asleep',
    HKCategoryValueSleepAnalysisAwake: 'awake',
    HKCategoryValueSleepAnalysisInBed: 'inbed',
  };

  // ---------- unit conversion ----------
  function convert(key, v, unit) {
    switch (key) {
      case 'distanceKm': return unit === 'mi' ? v * 1.609344 : unit === 'm' ? v / 1000 : v;
      case 'activeKcal': case 'kcal': return unit === 'kJ' ? v / 4.184 : v; // 'kcal' and 'Cal' are the same
      case 'waterL': return unit === 'mL' ? v / 1000 : unit === 'fl_oz_us' ? v * 0.0295735 : unit === 'fl_oz_imp' ? v * 0.0284131 : v;
      case 'proteinG': case 'carbsG': case 'fatG': return unit === 'mg' ? v / 1000 : unit === 'oz' ? v * 28.3495 : v;
      case 'spo2': case 'bodyFat': return v <= 1 ? v * 100 : v; // stored as a fraction
      case 'weightKg': return unit === 'lb' ? v * 0.45359237 : unit === 'st' ? v * 6.35029 : unit === 'g' ? v / 1000 : v;
      case 'heightCm': return unit === 'm' ? v * 100 : unit === 'in' ? v * 2.54 : unit === 'ft' ? v * 30.48 : v;
      case 'wristTemp': return unit === 'degF' ? (v - 32) / 1.8 : v;
      default: return v;
    }
  }

  // ---------- dates ----------
  // Health dates look like "2026-10-19 07:20:00 +1100". The day key is the local calendar day as recorded.
  const dayOf = (s) => s.slice(0, 10);
  function epoch(s) { // milliseconds since 1970 (UTC instant)
    return Date.parse(`${s.slice(0, 10)}T${s.slice(11, 19)}${s.slice(20, 23)}:${s.slice(23, 25)}`);
  }
  function wallMs(s) { // the local wall-clock time, expressed as if it were UTC
    return Date.parse(`${s.slice(0, 10)}T${s.slice(11, 19)}Z`);
  }
  const keyFromWall = (ms) => new Date(ms).toISOString().slice(0, 10);
  const dayIndex = (k) => Math.round(Date.parse(k + 'T00:00:00Z') / DAY_MS);

  // ---------- attribute reading ----------
  function attr(tag, name) {
    const i = tag.indexOf(' ' + name + '="');
    if (i < 0) return null;
    const s = i + name.length + 3;
    return tag.slice(s, tag.indexOf('"', s));
  }
  const unescapeXml = (s) => s.replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(Number(d)))
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');

  // ---------- zip reading ----------
  async function readBytes(blob, start, len) {
    return new Uint8Array(await blob.slice(start, start + len).arrayBuffer());
  }
  async function findXmlInZip(blob) {
    const size = blob.size;
    const tailLen = Math.min(size, 65557 + 20);
    const tail = await readBytes(blob, size - tailLen, tailLen);
    const dv = new DataView(tail.buffer);
    let eocd = -1;
    for (let i = tail.length - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('This file is not a valid zip archive.');
    let cdCount = dv.getUint16(eocd + 10, true), cdSize = dv.getUint32(eocd + 12, true), cdOffset = dv.getUint32(eocd + 16, true);
    if (cdOffset === 0xffffffff || cdCount === 0xffff) { // Zip64
      const loc = eocd - 20;
      if (loc < 0 || dv.getUint32(loc, true) !== 0x07064b50) throw new Error('Unsupported zip format.');
      const z64At = Number(dv.getBigUint64(loc + 8, true));
      const z = new DataView((await readBytes(blob, z64At, 56)).buffer);
      cdCount = Number(z.getBigUint64(32, true)); cdSize = Number(z.getBigUint64(40, true)); cdOffset = Number(z.getBigUint64(48, true));
    }
    const cd = await readBytes(blob, cdOffset, cdSize);
    const c = new DataView(cd.buffer);
    const dec = new TextDecoder();
    const entries = [];
    for (let p = 0, n = 0; n < cdCount && p + 46 <= cd.length; n++) {
      if (c.getUint32(p, true) !== 0x02014b50) break;
      const method = c.getUint16(p + 10, true);
      let comp = c.getUint32(p + 20, true), uncomp = c.getUint32(p + 24, true);
      const nameLen = c.getUint16(p + 28, true), extraLen = c.getUint16(p + 30, true), commentLen = c.getUint16(p + 32, true);
      let local = c.getUint32(p + 42, true);
      const name = dec.decode(cd.subarray(p + 46, p + 46 + nameLen));
      // Zip64 extra field holds the real sizes and offset when the 32-bit ones are saturated.
      let e = p + 46 + nameLen; const eEnd = e + extraLen;
      while (e + 4 <= eEnd) {
        const id = c.getUint16(e, true), sz = c.getUint16(e + 2, true);
        if (id === 0x0001) {
          let q = e + 4;
          if (uncomp === 0xffffffff) { uncomp = Number(c.getBigUint64(q, true)); q += 8; }
          if (comp === 0xffffffff) { comp = Number(c.getBigUint64(q, true)); q += 8; }
          if (local === 0xffffffff) { local = Number(c.getBigUint64(q, true)); q += 8; }
        }
        e += 4 + sz;
      }
      entries.push({ name, method, comp, uncomp, local });
      p += 46 + nameLen + extraLen + commentLen;
    }
    const xmls = entries.filter((x) => /\.xml$/i.test(x.name) && !/cda/i.test(x.name));
    const entry = xmls.find((x) => /(^|\/)export\.xml$/i.test(x.name)) || xmls.sort((a, b) => b.uncomp - a.uncomp)[0];
    if (!entry) throw new Error('No export.xml found in this zip. Choose the export.zip from the Health app.');
    const lh = new DataView((await readBytes(blob, entry.local, 30)).buffer);
    if (lh.getUint32(0, true) !== 0x04034b50) throw new Error('The zip archive is damaged.');
    const dataStart = entry.local + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    if (entry.method !== 0 && entry.method !== 8) throw new Error('Unsupported compression in this zip.');
    return { dataStart, comp: entry.comp, method: entry.method };
  }

  // ---------- main ----------
  async function parseExport(blob, onProgress) {
    const head = await readBytes(blob, 0, 4);
    const isZip = head[0] === 0x50 && head[1] === 0x4b && head[2] === 0x03 && head[3] === 0x04;
    // Progress counts input bytes (compressed bytes for a zip), measured before inflation.
    let consumed = 0;
    const counter = () => new TransformStream({ transform(chunk, ctl) { consumed += chunk.byteLength; ctl.enqueue(chunk); } });
    let byteStream, total;
    if (isZip) {
      const z = await findXmlInZip(blob);
      total = z.comp;
      byteStream = blob.slice(z.dataStart, z.dataStart + z.comp).stream().pipeThrough(counter());
      if (z.method === 8) {
        if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot unzip files. Unzip the export first and choose export.xml, or update your browser.');
        byteStream = byteStream.pipeThrough(new DecompressionStream('deflate-raw'));
      }
    } else {
      total = blob.size;
      byteStream = blob.stream().pipeThrough(counter());
    }

    const textStream = byteStream.pipeThrough(new TextDecoderStream());
    const reader = textStream.getReader();

    const st = {
      exportDate: null, cutoffDay: null, me: {}, records: 0, used: 0,
      hourly: new Map(), // key -> Map(hourKey -> Map(source -> value))
      mean: new Map(), // key -> Map(day -> [sum, n])
      last: new Map(), // key -> Map(day -> [epoch, value])
      hr: new Map(), // day -> [sum, n, min, max]
      mindful: new Map(), events: new Map(),
      nights: new Map(), // nightKey -> Map(source -> [[start,end,stage]])
      rings: new Map(), workouts: [], sources: new Map(),
      firstDay: null, lastDay: null,
    };

    let buf = '';
    let lastReport = 0;
    for (;;) {
      const { value, done } = await reader.read();
      if (value) buf += value;
      const cut = done ? buf.length : buf.lastIndexOf('>') + 1;
      if (cut > 0) {
        scan(buf.slice(0, cut), st);
        buf = buf.slice(cut);
      }
      const now = Date.now();
      if (onProgress && (now - lastReport > 200 || done)) {
        lastReport = now;
        onProgress({ phase: 'reading', done: consumed, total, records: st.records });
      }
      if (done) break;
    }
    if (onProgress) onProgress({ phase: 'building', done: total, total, records: st.records });
    return finish(st);
  }

  const TAG_RE = /<(Record|ActivitySummary|Workout|Me|ExportDate)\s([^>]*)>/g;
  function scan(text, st) {
    TAG_RE.lastIndex = 0;
    let m;
    while ((m = TAG_RE.exec(text))) {
      const kind = m[1], t = ' ' + m[2];
      if (kind === 'Record') { st.records++; record(t, st); }
      else if (kind === 'ActivitySummary') summary(t, st);
      else if (kind === 'Workout') workout(t, st);
      else if (kind === 'Me') me(t, st);
      else if (kind === 'ExportDate') {
        const v = attr(t, 'value');
        if (v) { st.exportDate = v; st.cutoffDay = keyFromWall(wallMs(v) - KEEP_DAYS * DAY_MS); }
      }
    }
  }

  function noteSource(st, t, type, day) {
    const name = unescapeXml(attr(t, 'sourceName') || 'Unknown');
    let s = st.sources.get(name);
    if (!s) {
      const dev = unescapeXml(attr(t, 'device') || '');
      const model = (dev.match(/model:([^,>]+)/) || [])[1] || '';
      const devName = (dev.match(/name:([^,>]+)/) || [])[1] || '';
      s = { name, model: model.trim(), device: devName.trim(), count: 0, first: day, last: day, types: new Map() };
      st.sources.set(name, s);
    }
    s.count++;
    if (day < s.first) s.first = day;
    if (day > s.last) s.last = day;
    s.types.set(type, (s.types.get(type) || 0) + 1);
    return name;
  }

  function record(t, st) {
    const type = attr(t, 'type');
    if (!type) return;
    const isSum = SUM[type], isMean = MEAN[type], isLast = LAST[type];
    if (!isSum && !isMean && !isLast && type !== HR && type !== SLEEP && type !== MINDFUL && !EVENTS[type]) return;
    const start = attr(t, 'startDate'), end = attr(t, 'endDate');
    if (!start || !end) return;
    const day = dayOf(start);
    if (st.cutoffDay && day < st.cutoffDay && type !== SLEEP) return;
    if (type === SLEEP && st.cutoffDay && dayOf(end) < st.cutoffDay) return;
    st.used++;
    if (!st.firstDay || day < st.firstDay) st.firstDay = day;
    if (!st.lastDay || day > st.lastDay) st.lastDay = day;
    const source = noteSource(st, t, type, day);
    const unit = attr(t, 'unit') || '';
    const raw = attr(t, 'value');

    if (isSum) {
      const v = convert(isSum, parseFloat(raw), unit);
      if (!isFinite(v)) return;
      const hourKey = start.slice(0, 13); // "YYYY-MM-DD HH"
      let byHour = st.hourly.get(isSum); if (!byHour) st.hourly.set(isSum, byHour = new Map());
      let bySrc = byHour.get(hourKey); if (!bySrc) byHour.set(hourKey, bySrc = new Map());
      bySrc.set(source, (bySrc.get(source) || 0) + v);
    } else if (isMean) {
      const v = convert(isMean, parseFloat(raw), unit);
      if (!isFinite(v)) return;
      let m = st.mean.get(isMean); if (!m) st.mean.set(isMean, m = new Map());
      const a = m.get(day) || [0, 0]; a[0] += v; a[1]++; m.set(day, a);
    } else if (isLast) {
      const v = convert(isLast, parseFloat(raw), unit);
      if (!isFinite(v)) return;
      let m = st.last.get(isLast); if (!m) st.last.set(isLast, m = new Map());
      const e = epoch(end), cur = m.get(day);
      if (!cur || e >= cur[0]) m.set(day, [e, v]);
    } else if (type === HR) {
      const v = parseFloat(raw);
      if (!isFinite(v)) return;
      const a = st.hr.get(day) || [0, 0, Infinity, -Infinity];
      a[0] += v; a[1]++; if (v < a[2]) a[2] = v; if (v > a[3]) a[3] = v;
      st.hr.set(day, a);
    } else if (type === SLEEP) {
      const stage = STAGE[raw];
      if (!stage) return;
      const s = epoch(start), e = epoch(end);
      if (!(e > s)) return;
      // A night runs 18:00 to 18:00 and belongs to the day you wake up.
      const night = keyFromWall(wallMs(end) + 6 * 3600000);
      let bySrc = st.nights.get(night); if (!bySrc) st.nights.set(night, bySrc = new Map());
      let list = bySrc.get(source); if (!list) bySrc.set(source, list = []);
      list.push([s, e, stage, wallMs(start) - s]); // keep the tz offset to show local clock times
    } else if (type === MINDFUL) {
      const mins = (epoch(end) - epoch(start)) / 60000;
      if (mins > 0) st.mindful.set(day, (st.mindful.get(day) || 0) + mins);
    } else if (EVENTS[type]) {
      const k = EVENTS[type];
      const a = st.events.get(day) || {}; a[k] = (a[k] || 0) + 1; st.events.set(day, a);
    }
  }

  function summary(t, st) {
    const day = attr(t, 'dateComponents');
    if (!day || (st.cutoffDay && day < st.cutoffDay)) return;
    const unit = attr(t, 'activeEnergyBurnedUnit') || 'kcal';
    const k = (n) => { const v = parseFloat(attr(t, n)); return isFinite(v) ? v : null; };
    const move = k('activeEnergyBurned'), moveGoal = k('activeEnergyBurnedGoal');
    st.rings.set(day, {
      move: move == null ? null : convert('activeKcal', move, unit), moveGoal: moveGoal == null ? null : convert('activeKcal', moveGoal, unit),
      ex: k('appleExerciseTime'), exGoal: k('appleExerciseTimeGoal'), stand: k('appleStandHours'), standGoal: k('appleStandHoursGoal'),
    });
  }

  function workout(t, st) {
    const start = attr(t, 'startDate');
    if (!start || (st.cutoffDay && dayOf(start) < st.cutoffDay)) return;
    const type = (attr(t, 'workoutActivityType') || '').replace('HKWorkoutActivityType', '');
    let mins = parseFloat(attr(t, 'duration'));
    const du = attr(t, 'durationUnit');
    if (du === 's') mins /= 60; else if (du === 'h') mins *= 60;
    st.workouts.push({ day: dayOf(start), type, mins: isFinite(mins) ? Math.round(mins) : null, source: unescapeXml(attr(t, 'sourceName') || '') });
  }

  function me(t, st) {
    const dob = attr(t, 'HKCharacteristicTypeIdentifierDateOfBirth');
    const sex = attr(t, 'HKCharacteristicTypeIdentifierBiologicalSex');
    const blood = attr(t, 'HKCharacteristicTypeIdentifierBloodType');
    const wheel = attr(t, 'HKCharacteristicTypeIdentifierWheelchairUse');
    st.me = {
      dob: dob || null,
      sex: sex && !/NotSet/.test(sex) ? sex.replace('HKBiologicalSex', '').toLowerCase() : null,
      blood: blood && !/NotSet/.test(blood) ? blood.replace('HKBloodType', '').replace('Positive', '+').replace('Negative', '−') : null,
      wheelchair: wheel && !/NotSet/.test(wheel) ? /Yes/.test(wheel) : null,
    };
  }

  // ---------- interval helpers ----------
  function unionMinutes(intervals) {
    if (!intervals.length) return 0;
    const s = intervals.slice().sort((a, b) => a[0] - b[0]);
    let total = 0, cs = s[0][0], ce = s[0][1];
    for (let i = 1; i < s.length; i++) {
      if (s[i][0] <= ce) { if (s[i][1] > ce) ce = s[i][1]; }
      else { total += ce - cs; cs = s[i][0]; ce = s[i][1]; }
    }
    return (total + ce - cs) / 60000;
  }

  function finishNight(bySrc) {
    // Use the one source that recorded the most detail for the night (stages beat plain "asleep").
    let best = null, bestScore = -1;
    for (const [src, list] of bySrc) {
      const staged = list.filter((x) => x[2] === 'core' || x[2] === 'deep' || x[2] === 'rem');
      const asleep = list.filter((x) => x[2] !== 'awake' && x[2] !== 'inbed');
      const score = unionMinutes(staged) * 2 + unionMinutes(asleep);
      if (score > bestScore) { bestScore = score; best = { src, list }; }
    }
    if (!best) return null;
    const L = best.list;
    const by = (k) => L.filter((x) => x[2] === k);
    const asleepIv = L.filter((x) => x[2] === 'core' || x[2] === 'deep' || x[2] === 'rem' || x[2] === 'asleep');
    const asleep = unionMinutes(asleepIv);
    if (asleep < 30) return null; // ignore stray naps shorter than half an hour
    const start = Math.min(...L.map((x) => x[0])), end = Math.max(...L.map((x) => x[1]));
    const offset = L[0][3];
    const stages = { core: unionMinutes(by('core')), deep: unionMinutes(by('deep')), rem: unionMinutes(by('rem')), awake: unionMinutes(by('awake')), unspecified: unionMinutes(by('asleep')) };
    const segs = L.filter((x) => x[2] !== 'inbed').sort((a, b) => a[0] - b[0])
      .map((x) => [Math.round((x[0] - start) / 60000), Math.round((x[1] - start) / 60000), x[2] === 'asleep' ? 'core' : x[2]]);
    return {
      source: best.src, asleepMin: Math.round(asleep), inBedMin: Math.round((end - start) / 60000),
      bed: new Date(start + offset).toISOString().slice(11, 16), wake: new Date(end + offset).toISOString().slice(11, 16),
      stages: Object.fromEntries(Object.entries(stages).map(([k, v]) => [k, Math.round(v)])), segs, staged: stages.core + stages.deep + stages.rem > 0,
    };
  }

  function finish(st) {
    const days = {};
    const put = (day, k, v) => { (days[day] ||= {})[k] = v; };
    for (const [key, byHour] of st.hourly) {
      const perDay = new Map();
      for (const [hourKey, bySrc] of byHour) {
        let max = 0; for (const v of bySrc.values()) if (v > max) max = v;
        const d = hourKey.slice(0, 10); perDay.set(d, (perDay.get(d) || 0) + max);
      }
      for (const [d, v] of perDay) put(d, key, key === 'distanceKm' || key === 'waterL' ? Math.round(v * 100) / 100 : Math.round(v));
    }
    for (const [key, m] of st.mean) for (const [d, a] of m) put(d, key, Math.round((a[0] / a[1]) * 10) / 10);
    for (const [key, m] of st.last) for (const [d, a] of m) put(d, key, Math.round(a[1] * 10) / 10);
    for (const [d, a] of st.hr) put(d, 'hr', { avg: Math.round(a[0] / a[1]), min: Math.round(a[2]), max: Math.round(a[3]) });
    for (const [d, v] of st.mindful) put(d, 'mindfulMin', Math.round(v));
    for (const [d, v] of st.events) put(d, 'events', v);
    for (const [d, r] of st.rings) put(d, 'rings', r);

    const nightKeys = [...st.nights.keys()].sort();
    const keepSegs = new Set(nightKeys.slice(-STAGE_NIGHTS));
    for (const k of nightKeys) {
      const n = finishNight(st.nights.get(k));
      if (!n) continue;
      if (!keepSegs.has(k)) delete n.segs;
      put(k, 'sleep', n);
    }
    const workouts = st.workouts.sort((a, b) => (a.day < b.day ? -1 : 1));
    for (const w of workouts) { const d = (days[w.day] ||= {}); (d.workouts ||= []).push({ type: w.type, mins: w.mins }); }

    const sortedDays = Object.keys(days).sort();
    const lastDataDay = sortedDays[sortedDays.length - 1] || null;
    const sources = [...st.sources.values()].sort((a, b) => b.count - a.count).map((s) => ({
      name: s.name, model: s.model, device: s.device, count: s.count, first: s.first, last: s.last,
      kind: /watch/i.test(s.model) || /watch/i.test(s.device) ? 'watch' : /fitbit|google/i.test(s.name) ? 'fitbit' : /iphone/i.test(s.model) ? 'iphone' : 'app',
      types: Object.fromEntries([...s.types.entries()].sort((a, b) => b[1] - a[1]).map(([t, n]) => [t.replace(/^HK(Quantity|Category)TypeIdentifier/, ''), n])),
    }));
    return {
      version: 1,
      exportDate: st.exportDate, lastDataDay, firstDay: sortedDays[0] || null,
      recordsScanned: st.records, recordsUsed: st.used, me: st.me, sources, days,
    };
  }

  // Worker wiring.
  if (scope && typeof scope.postMessage === 'function' && typeof scope.addEventListener === 'function') {
    scope.addEventListener('message', async (e) => {
      try {
        const result = await parseExport(e.data.file, (p) => scope.postMessage({ type: 'progress', ...p }));
        scope.postMessage({ type: 'done', result });
      } catch (err) {
        scope.postMessage({ type: 'error', message: err && err.message ? err.message : String(err) });
      }
    });
  }
  return { parseExport, unionMinutes, dayIndex };
}

</script>
<script>
// BE analytics: everything shown on screen is computed here from the parsed export.
// Ported from the Swift BECore package (MetricsEngine, CoachLibrary, Thresholds, Greeting,
// PlanRecommender) so the web and iPhone versions reason the same way.

function beAnalyticsModule() {
  const DAY = 86400000;
  const addDays = (k, n) => new Date(Date.parse(k + 'T00:00:00Z') + n * DAY).toISOString().slice(0, 10);
  const range = (from, to) => { const out = []; for (let k = from; k <= to; k = addDays(k, 1)) out.push(k); return out; };
  const clamp = (x) => Math.max(0, Math.min(1, x));

  // Metric catalogue: how to read each value from a day record, and how to judge it.
  const METRICS = {
    steps: { name: 'Steps', unit: 'steps', d: 0, better: 'up', get: (d) => d.steps },
    distanceKm: { name: 'Distance', unit: 'km', d: 1, better: 'up', get: (d) => d.distanceKm },
    exerciseMin: { name: 'Exercise', unit: 'min', d: 0, better: 'up', get: (d) => d.exerciseMin },
    activeKcal: { name: 'Active energy', unit: 'kcal', d: 0, better: 'up', get: (d) => d.activeKcal },
    rhr: { name: 'Resting heart rate', unit: 'bpm', d: 0, better: 'down', get: (d) => d.rhr },
    hrv: { name: 'Heart rate variability', short: 'HRV', unit: 'ms', d: 0, better: 'up', get: (d) => d.hrv },
    spo2: { name: 'Blood oxygen', unit: '%', d: 0, better: 'up', get: (d) => d.spo2 },
    resp: { name: 'Respiratory rate', unit: 'br/min', d: 1, better: 'down', get: (d) => d.resp },
    vo2: { name: 'Cardio fitness', unit: 'VO₂ max', d: 1, better: 'up', get: (d) => d.vo2, carry: true },
    weightKg: { name: 'Weight', unit: 'kg', d: 1, better: 'range', get: (d) => d.weightKg, carry: true },
    sleepH: { name: 'Sleep', unit: 'h', d: 1, better: 'up', get: (d) => (d.sleep ? d.sleep.asleepMin / 60 : undefined) },
    waterL: { name: 'Water', unit: 'L', d: 2, better: 'up', get: (d) => d.waterL },
    kcal: { name: 'Calories eaten', unit: 'kcal', d: 0, better: 'range', get: (d) => d.kcal },
    proteinG: { name: 'Protein', unit: 'g', d: 0, better: 'up', get: (d) => d.proteinG },
    carbsG: { name: 'Carbs', unit: 'g', d: 0, better: 'range', get: (d) => d.carbsG },
    fatG: { name: 'Fat', unit: 'g', d: 0, better: 'range', get: (d) => d.fatG },
    mindfulMin: { name: 'Mindful minutes', unit: 'min', d: 0, better: 'up', get: (d) => d.mindfulMin },
    heightCm: { name: 'Height', unit: 'cm', d: 0, better: 'range', get: (d) => d.heightCm, carry: true },
  };

  function fmt(v, d = 0) {
    if (v == null || !isFinite(v)) return '–';
    return Number(v).toLocaleString('en-AU', { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  function value(data, k, day) {
    const d = data.days[day];
    const v = d ? METRICS[k].get(d) : undefined;
    return v == null || !isFinite(v) ? null : v;
  }

  // Latest value on or before `day` (for weight and VO2 max, measured only now and then).
  function latest(data, k, day, maxBack = 60) {
    for (let i = 0; i <= maxBack; i++) { const kk = addDays(day, -i); const v = value(data, k, kk); if (v != null) return { v, day: kk }; }
    return null;
  }

  function series(data, k, toDay, n) {
    return range(addDays(toDay, -(n - 1)), toDay).map((day) => ({ day, v: value(data, k, day) }));
  }

  // Your normal: the 90 days before `day`, excluding it, like MetricsEngine.baseline.
  function baseline(data, k, day, window = 90) {
    const xs = series(data, k, addDays(day, -1), window).map((p) => p.v).filter((v) => v != null);
    if (xs.length < 3) return null;
    const mean = xs.reduce((a, b) => a + b, 0) / xs.length;
    const sd = Math.sqrt(xs.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(1, xs.length - 1));
    return { mean, sd, n: xs.length, z: (v) => (xs.length >= 7 && sd > 0 ? (v - mean) / sd : null) };
  }

  function average(data, k, day, n = 7) {
    const xs = series(data, k, addDays(day, -1), n).map((p) => p.v).filter((v) => v != null);
    return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
  }

  // Least-squares slope over 14 days; steady when the change is under 3% of the mean.
  function trend(data, k, day, n = 14) {
    const pts = series(data, k, addDays(day, -1), n).map((p, i) => [i, p.v]).filter((p) => p[1] != null);
    if (pts.length < 5) return 'steady';
    const mx = pts.reduce((a, p) => a + p[0], 0) / pts.length, my = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    let num = 0, den = 0;
    for (const [x, y] of pts) { num += (x - mx) * (y - my); den += (x - mx) ** 2; }
    if (!den || !my) return 'steady';
    const change = (num / den) * n;
    return Math.abs(change) < Math.abs(my) * 0.03 ? 'steady' : change > 0 ? 'rising' : 'falling';
  }

  // ---------- targets ----------
  function recommendTargets(data, day) {
    const t = {};
    const st = baseline(data, 'steps', day);
    t.steps = st ? Math.min(15000, Math.max(5000, Math.round((st.mean * 1.1) / 500) * 500)) : 8000;
    t.sleepH = 7.5;
    const ex = baseline(data, 'exerciseMin', day);
    t.exerciseMin = Math.max(30, Math.min(60, Math.round((ex ? ex.mean : 30) / 5) * 5));
    const w = baseline(data, 'waterL', day);
    t.waterL = w ? Math.min(3.5, Math.max(2, Math.round((w.mean + 0.25) * 4) / 4)) : 2;
    const kg = latest(data, 'weightKg', day, 120);
    if (kg && kg.v > 30 && kg.v < 300) t.proteinG = Math.round((kg.v * 1.2) / 5) * 5;
    return t;
  }
  const REASONS = {
    steps: (data, day) => { const b = baseline(data, 'steps', day); return b ? `Your 90-day average is ${fmt(b.mean)}. This is a 10% stretch.` : 'A common starting point until BE learns your normal.'; },
    sleepH: (data, day) => { const b = baseline(data, 'sleepH', day); return b ? `You average ${fmt(b.mean, 1)} h. Most adults need 7–9 h.` : 'Most adults need 7–9 hours.'; },
    exerciseMin: () => 'Australian guidelines suggest 150–300 minutes of moderate activity a week.',
    waterL: (data, day) => { const b = baseline(data, 'waterL', day); return b ? `You log about ${fmt(b.mean, 1)} L a day. A little more is easy.` : 'A simple daily baseline; more in heat or on training days.'; },
    proteinG: () => 'About 1.2 g per kg of body weight, a common target for active adults.',
  };

  function isMet(k, v, target) {
    if (v == null || target == null) return false;
    if (k === 'sleepH') return v >= target - 0.25 && v <= target + 1.5;
    if (k === 'kcal') return Math.abs(v - target) <= target * 0.1;
    return v >= target;
  }

  // ---------- safety and coach ----------
  function safety(k, v) {
    if (v == null) return null;
    if (k === 'rhr' && v > 100) return 'Your resting heart rate is above 100 bpm. If this keeps happening, or you feel dizzy, short of breath or have chest pain, talk to your GP. Call 000 in an emergency.';
    if (k === 'rhr' && v < 40) return 'Your resting heart rate is below 40 bpm. That can be normal for very fit people, but if you feel faint or tired, talk to your GP.';
    if (k === 'spo2' && v < 92) return 'Your blood oxygen reading is below 92%. Wrist readings can be off, so re-check while still. If it stays low or you feel short of breath, seek medical advice.';
    if (k === 'resp' && v > 25) return 'Your sleeping breathing rate is higher than typical. If you also feel unwell, talk to your GP.';
    return null;
  }

  function coach(data, k, day, targets) {
    const m = METRICS[k];
    const v = m.carry ? (latest(data, k, day) || {}).v ?? null : value(data, k, day);
    const b = baseline(data, k, day);
    const t = targets[k];
    const tr = trend(data, k, day);
    const z = v != null && b ? b.z(v) : null;
    const pos = z == null ? 'unknown' : z >= 1.5 ? 'high' : z <= -1.5 ? 'low' : 'normal';
    const usual = b ? `${fmt(b.mean, m.d)} ${m.unit}` : null;
    const note = (h, tone, mean, act) => ({ h, tone, mean, act, safety: safety(k, v) });
    if (v == null) {
      const act = ['hrv', 'spo2', 'resp'].includes(k) ? 'Wear your Apple Watch to sleep. These are measured overnight.'
        : ['waterL', 'kcal', 'proteinG', 'carbsG', 'fatG'].includes(k) ? 'Log food and water in Apple Health or an app that writes to it.'
        : k === 'weightKg' ? 'Weigh in with a connected scale or log it in Apple Health.' : 'No reading for this day in your export.';
      return note(`No ${m.name.toLowerCase()} recorded`, 'neutral', `Your export has no ${m.name.toLowerCase()} for this day.`, act);
    }
    let n;
    switch (k) {
      case 'rhr':
        n = pos === 'high' ? note('Higher than your usual', 'attention', `${fmt(v - b.mean)} bpm above your normal of ${usual}. Short-term rises often follow poor sleep, alcohol, stress, illness or a hard session.`, 'Keep training easy, drink water and get to bed earlier. If it stays up for a week, talk to your GP.')
          : pos === 'low' ? note('Lower than your usual', 'positive', 'A lower resting heart rate usually means you are well recovered or getting fitter.', 'A good day to train if you feel good.')
          : note('In your normal range', 'neutral', `A simple read on recovery and fitness.${usual ? ` Your usual is ${usual}.` : ''}`, tr === 'falling' ? 'It is trending down. Keep up the consistency.' : 'Regular cardio and good sleep bring it down over time.');
        break;
      case 'hrv':
        n = pos === 'low' ? note('Lower than your usual', 'attention', `${fmt(v)} ms against your normal of ${usual}. HRV dips under strain: hard training, poor sleep, stress, alcohol or illness.`, 'Go lighter: a walk, mobility or rest. Prioritise sleep tonight.')
          : pos === 'high' ? note('Higher than your usual', 'positive', 'Higher HRV than your norm usually signals good recovery.', 'Your body is ready. A good day for a harder session.')
          : note('In your normal range', 'neutral', `HRV is very personal, so compare it only with your own trend.${usual ? ` Your usual is ${usual}.` : ''}`, 'Keep sleep and training consistent and watch the 7-day trend.');
        break;
      case 'spo2':
        n = v >= 95 ? note('Looks normal', 'positive', 'Most healthy people read 95–100%.', 'Nothing to do.') : note('A little low', 'attention', 'Wrist readings can drop with movement, cold hands or a loose band.', 'Re-check while sitting still with the watch snug.');
        break;
      case 'resp':
        n = note(pos === 'high' ? 'Higher than your usual' : 'In your normal range', pos === 'high' ? 'attention' : 'neutral', 'Breaths per minute while you sleep. It often rises a little when you are run down.', pos === 'high' ? 'Take it easy and keep an eye on how you feel.' : 'Nothing to do.');
        break;
      case 'vo2':
        n = note(tr === 'rising' ? 'Improving' : tr === 'falling' ? 'Slipping a little' : 'Holding steady', tr === 'rising' ? 'positive' : 'neutral', 'VO₂ max estimates how well your body uses oxygen during exercise, one of the strongest markers of long-term health.', 'Brisk walks, runs or rides where you are breathing hard for 20+ minutes push it up.');
        break;
      case 'weightKg': {
        const w30 = latest(data, 'weightKg', addDays(day, -30), 30);
        const ch = w30 ? v - w30.v : null;
        n = note(ch == null ? `Latest: ${fmt(v, 1)} kg` : Math.abs(ch) < 0.5 ? 'Steady' : ch < 0 ? `Down ${fmt(-ch, 1)} kg in 30 days` : `Up ${fmt(ch, 1)} kg in 30 days`, 'neutral', 'Day-to-day changes are mostly water. The 30-day trend is what matters.', 'Weigh in at the same time each morning for a clearer trend.');
        break;
      }
      case 'sleepH': {
        const tt = t || 7.5;
        n = v < tt - 1 ? note('Short night', 'attention', `${fmt(tt - v, 1)} h under your ${fmt(tt, 1)} h target. Short sleep affects mood, appetite and recovery.`, 'Aim for a consistent bedtime tonight and keep caffeine before midday.')
          : note('Well rested', 'positive', `Close to your ${fmt(tt, 1)} h target.`, 'Keep a consistent wake time, including weekends.');
        break;
      }
      default: {
        if (t == null) { n = note(`${fmt(v, m.d)} ${m.unit}`, 'neutral', usual ? `Your usual is ${usual}.` : 'BE is still learning your normal.', 'Add a target in Plan to track this.'); break; }
        if (isMet(k, v, t)) { n = note('Target hit', 'positive', `${fmt(v, m.d)} of ${fmt(t, m.d)} ${m.unit}.`, 'Nice work.'); break; }
        const rem = Math.max(0, t - v);
        const act = { steps: `${fmt(rem)} short of target, about ${Math.round(rem / 110)} minutes of walking.`, waterL: `${fmt(rem, 2)} L short of target.`, proteinG: `${fmt(rem)} g short. Eggs, Greek yoghurt, tuna or tofu help.`, exerciseMin: `${fmt(rem)} min short. A brisk walk counts.`, kcal: v > t ? 'Over target. Look at the weekly picture rather than one day.' : 'Log meals as you go so the day adds up.' }[k] || `${fmt(rem, m.d)} ${m.unit} short of target.`;
        n = note(`${Math.round(clamp(v / t) * 100)}% of target`, 'neutral', `${fmt(v, m.d)} of ${fmt(t, m.d)} ${m.unit}.`, act);
      }
    }
    if (n.safety) n.tone = 'attention';
    return n;
  }

  // ---------- BE score and greeting (BECore Greeting) ----------
  function score(data, day, targets) {
    const v = (k) => value(data, k, day);
    const rec = [];
    rec.push(v('sleepH') == null ? 0.5 : clamp(v('sleepH') / (targets.sleepH || 7.5)));
    const br = baseline(data, 'rhr', day), bh = baseline(data, 'hrv', day);
    if (v('rhr') != null && br) rec.push(clamp(1 - Math.max(0, v('rhr') - br.mean) / 10));
    if (v('hrv') != null && bh && bh.mean > 0) rec.push(clamp(v('hrv') / bh.mean));
    const act = [['steps', 8000], ['exerciseMin', 30], ['waterL', 2]].map(([k, f]) => (v(k) == null ? 0.5 : clamp(v(k) / (targets[k] || f))));
    const recovery = rec.reduce((a, b) => a + b, 0) / rec.length, activity = act.reduce((a, b) => a + b, 0) / act.length;
    return { score: Math.round(100 * (0.55 * recovery + 0.45 * activity)), recovery, activity };
  }

  function flags(data, day, targets) {
    const out = [], v = (k) => value(data, k, day);
    if (v('sleepH') != null && v('sleepH') < (targets.sleepH || 7.5) - 1) out.push('a short night');
    const br = baseline(data, 'rhr', day); const zr = v('rhr') != null && br ? br.z(v('rhr')) : null;
    if (zr != null && zr >= 1.5) out.push(`resting heart rate up ${fmt(v('rhr') - br.mean)} bpm`);
    const bh = baseline(data, 'hrv', day); const zh = v('hrv') != null && bh ? bh.z(v('hrv')) : null;
    if (zh != null && zh <= -1.5) out.push('HRV below your usual');
    return out;
  }

  function greeting(data, day, targets, name, isLatest, hour) {
    const { score: sc, recovery, activity } = score(data, day, targets);
    const fl = flags(data, day, targets);
    const list = (a) => (a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : a[0] || '');
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const dayName = new Date(day + 'T12:00:00Z').toLocaleDateString('en-AU', { weekday: 'long', timeZone: 'UTC' });
    const base = isLatest ? (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening') : dayName;
    const hello = isLatest && name ? `${base}, ${name}` : base;
    let line, why;
    if (fl.length >= 2 || recovery < 0.75) { line = isLatest ? 'easy does it' : 'was a recovery day'; why = `${fl.length ? cap(list(fl)) + '.' : 'Recovery was lower than usual.'} Keep training light, drink water and aim for an early night.`; }
    else if (sc >= 85) { line = isLatest ? "you're flying" : 'was a cracker'; why = 'Recovered and moving well.'; }
    else if (recovery >= 0.9) { line = isLatest ? "you're ready to go" : 'was well recovered'; why = 'Recovery looks strong. A good day for a harder session.'; }
    else { line = isLatest ? 'steady as she goes' : 'was a steady day'; why = fl.length ? `${cap(list(fl))}, otherwise on track.` : 'On track. Keep chipping away at your targets.'; }
    return { hello, line, score: sc, recovery, activity, why };
  }

  // ---------- sleep score ----------
  // 60% duration against target (full marks at target, zero at 2.5 h short), 25% deep + REM share
  // (full marks at 45%), 15% efficiency (asleep / in bed, full marks at 95%).
  function sleepScore(sleep, targetH) {
    if (!sleep) return null;
    const t = (targetH || 7.5) * 60;
    const dur = clamp(1 - Math.max(0, t - sleep.asleepMin) / 150);
    const restorative = sleep.staged ? clamp((sleep.stages.deep + sleep.stages.rem) / sleep.asleepMin / 0.45) : null;
    const eff = clamp(sleep.asleepMin / Math.max(sleep.inBedMin, sleep.asleepMin) / 0.95);
    const s = restorative == null ? Math.round(100 * (0.8 * dur + 0.2 * eff)) : Math.round(60 * dur + 25 * restorative + 15 * eff);
    return { score: s, label: s >= 85 ? 'Excellent' : s >= 70 ? 'Good' : s >= 55 ? 'Fair' : 'Poor', efficiency: Math.round((sleep.asleepMin / Math.max(1, sleep.inBedMin)) * 100) };
  }

  // ---------- streaks and badges, from real history ----------
  const GOALS = {
    steps: { name: 'Step target', test: (data, d, t) => isMet('steps', value(data, 'steps', d), t.steps) },
    exerciseMin: { name: 'Exercise target', test: (data, d, t) => isMet('exerciseMin', value(data, 'exerciseMin', d), t.exerciseMin) },
    sleepH: { name: 'Sleep target', test: (data, d, t) => isMet('sleepH', value(data, 'sleepH', d), t.sleepH) },
    waterL: { name: 'Water target', test: (data, d, t) => isMet('waterL', value(data, 'waterL', d), t.waterL) },
    rings: { name: 'All rings closed', test: (data, d) => { const r = data.days[d] && data.days[d].rings; return !!(r && r.moveGoal && r.move >= r.moveGoal && r.exGoal && r.ex >= r.exGoal && r.standGoal && r.stand >= r.standGoal); } },
  };
  function streaks(data, day, targets) {
    const first = data.firstDay;
    const out = {};
    for (const [k, g] of Object.entries(GOALS)) {
      let current = 0;
      for (let d = day; d >= first; d = addDays(d, -1)) { if (g.test(data, d, targets)) current++; else break; }
      let best = 0, run = 0;
      for (const d of range(first, day)) { if (g.test(data, d, targets)) { run++; best = Math.max(best, run); } else run = 0; }
      const last30 = range(addDays(day, -29), day);
      const hits = last30.filter((d) => g.test(data, d, targets)).length;
      const week = range(addDays(day, -6), day).map((d) => g.test(data, d, targets));
      out[k] = { name: g.name, current, best, hits30: hits, week };
    }
    return out;
  }
  function badges(data, day, targets, st) {
    const workouts30 = range(addDays(day, -29), day).reduce((a, d) => a + ((data.days[d] && data.days[d].workouts) || []).length, 0);
    return [
      { id: 'steps7', title: 'One week strong', detail: '7 days in a row on your step target', on: st.steps.best >= 7 },
      { id: 'steps30', title: 'Habit formed', detail: '30 days in a row on your step target', on: st.steps.best >= 30 },
      { id: 'rings7', title: 'Perfect week', detail: 'All rings closed 7 days in a row', on: st.rings.best >= 7 },
      { id: 'sleep5', title: 'Well rested', detail: 'Sleep target hit 5 nights in a row', on: st.sleepH.best >= 5 },
      { id: 'water14', title: 'Hydration hero', detail: 'Water target hit on 14 of the last 30 days', on: st.waterL.hits30 >= 14 },
      { id: 'work8', title: 'Regular mover', detail: '8 or more workouts in the last 30 days', on: workouts30 >= 8 },
    ];
  }

  // ---------- compact summary for the AI coach ----------
  function aiSummary(data, day, targets, name) {
    const keys = ['steps', 'exerciseMin', 'activeKcal', 'rhr', 'hrv', 'spo2', 'resp', 'vo2', 'weightKg', 'sleepH', 'waterL', 'kcal', 'proteinG'];
    const metrics = {};
    for (const k of keys) {
      const m = METRICS[k];
      const v = m.carry ? (latest(data, k, day) || {}).v ?? null : value(data, k, day);
      const b = baseline(data, k, day), a7 = average(data, k, day);
      if (v == null && !b) continue;
      const r = (x) => (x == null ? null : Math.round(x * 10) / 10);
      metrics[k] = { label: m.name, unit: m.unit, day: r(v), avg7: r(a7), normal90: b ? r(b.mean) : null, trend: trend(data, k, day), target: targets[k] ?? null };
    }
    const sl = data.days[day] && data.days[day].sleep;
    const age = data.me && data.me.dob ? Math.floor((Date.parse(day) - Date.parse(data.me.dob)) / (365.25 * DAY)) : null;
    const st = streaks(data, day, targets);
    return {
      date: day, name: name || null,
      profile: { age, sex: data.me ? data.me.sex : null, heightCm: (latest(data, 'heightCm', day, 3650) || {}).v ?? null },
      metrics,
      sleep: sl ? { asleepMin: sl.asleepMin, inBedMin: sl.inBedMin, bed: sl.bed, wake: sl.wake, stages: sl.stages, score: (sleepScore(sl, targets.sleepH) || {}).score } : null,
      beScore: score(data, day, targets).score,
      streaks: Object.fromEntries(Object.entries(st).map(([k, s]) => [k, { current: s.current, best: s.best, hitsLast30: s.hits30 }])),
      workoutsLast7: range(addDays(day, -6), day).flatMap((d) => (data.days[d] && data.days[d].workouts) || []),
      sources: data.sources.slice(0, 6).map((s) => s.name),
    };
  }

  return { METRICS, fmt, addDays, range, value, latest, series, baseline, average, trend, recommendTargets, REASONS, isMet, coach, score, greeting, sleepScore, streaks, badges, aiSummary, safety };
}

const PARSER_SRC = "// Apple Health export parser. Runs inside a Web Worker (see app.js), or in Node for tests.\n//\n// Input: the export.zip from Health \u2192 profile \u2192 Export All Health Data, or the export.xml inside it.\n// Output: compact daily aggregates. Raw records never leave this function.\n//\n// The whole file is streamed: the zip is read through its central directory with Blob.slice,\n// the export.xml entry is inflated with DecompressionStream('deflate-raw'), and the XML is scanned\n// chunk by chunk. Nothing is uploaded anywhere.\n\n/* eslint-disable no-restricted-globals */\nfunction beParserModule(scope) {\n  const DAY_MS = 86400000;\n  const KEEP_DAYS = 400; // daily history kept, counted back from the export date\n  const STAGE_NIGHTS = 21; // nights kept with full stage segments for the hypnogram\n\n  // Cumulative types: deduplicated by keeping, for each hour, the largest total from any one source.\n  // This mirrors what Apple Health shows when an Apple Watch and a Fitbit both record steps.\n  const SUM = {\n    HKQuantityTypeIdentifierStepCount: 'steps',\n    HKQuantityTypeIdentifierDistanceWalkingRunning: 'distanceKm',\n    HKQuantityTypeIdentifierFlightsClimbed: 'flights',\n    HKQuantityTypeIdentifierActiveEnergyBurned: 'activeKcal',\n    HKQuantityTypeIdentifierAppleExerciseTime: 'exerciseMin',\n    HKQuantityTypeIdentifierDietaryWater: 'waterL',\n    HKQuantityTypeIdentifierDietaryEnergyConsumed: 'kcal',\n    HKQuantityTypeIdentifierDietaryProtein: 'proteinG',\n    HKQuantityTypeIdentifierDietaryCarbohydrates: 'carbsG',\n    HKQuantityTypeIdentifierDietaryFatTotal: 'fatG',\n  };\n  // Discrete types: daily mean of all readings.\n  const MEAN = {\n    HKQuantityTypeIdentifierRestingHeartRate: 'rhr',\n    HKQuantityTypeIdentifierHeartRateVariabilitySDNN: 'hrv',\n    HKQuantityTypeIdentifierOxygenSaturation: 'spo2',\n    HKQuantityTypeIdentifierRespiratoryRate: 'resp',\n    HKQuantityTypeIdentifierWalkingHeartRateAverage: 'walkHr',\n    HKQuantityTypeIdentifierAppleSleepingWristTemperature: 'wristTemp',\n  };\n  // Last reading of the day.\n  const LAST = {\n    HKQuantityTypeIdentifierVO2Max: 'vo2',\n    HKQuantityTypeIdentifierBodyMass: 'weightKg',\n    HKQuantityTypeIdentifierBodyFatPercentage: 'bodyFat',\n    HKQuantityTypeIdentifierHeight: 'heightCm',\n  };\n  const HR = 'HKQuantityTypeIdentifierHeartRate';\n  const SLEEP = 'HKCategoryTypeIdentifierSleepAnalysis';\n  const MINDFUL = 'HKCategoryTypeIdentifierMindfulSession';\n  const EVENTS = {\n    HKCategoryTypeIdentifierHighHeartRateEvent: 'highHr',\n    HKCategoryTypeIdentifierLowHeartRateEvent: 'lowHr',\n    HKCategoryTypeIdentifierIrregularHeartRhythmEvent: 'irregular',\n  };\n  const STAGE = {\n    HKCategoryValueSleepAnalysisAsleepCore: 'core',\n    HKCategoryValueSleepAnalysisAsleepDeep: 'deep',\n    HKCategoryValueSleepAnalysisAsleepREM: 'rem',\n    HKCategoryValueSleepAnalysisAsleepUnspecified: 'asleep',\n    HKCategoryValueSleepAnalysisAsleep: 'asleep',\n    HKCategoryValueSleepAnalysisAwake: 'awake',\n    HKCategoryValueSleepAnalysisInBed: 'inbed',\n  };\n\n  // ---------- unit conversion ----------\n  function convert(key, v, unit) {\n    switch (key) {\n      case 'distanceKm': return unit === 'mi' ? v * 1.609344 : unit === 'm' ? v / 1000 : v;\n      case 'activeKcal': case 'kcal': return unit === 'kJ' ? v / 4.184 : v; // 'kcal' and 'Cal' are the same\n      case 'waterL': return unit === 'mL' ? v / 1000 : unit === 'fl_oz_us' ? v * 0.0295735 : unit === 'fl_oz_imp' ? v * 0.0284131 : v;\n      case 'proteinG': case 'carbsG': case 'fatG': return unit === 'mg' ? v / 1000 : unit === 'oz' ? v * 28.3495 : v;\n      case 'spo2': case 'bodyFat': return v <= 1 ? v * 100 : v; // stored as a fraction\n      case 'weightKg': return unit === 'lb' ? v * 0.45359237 : unit === 'st' ? v * 6.35029 : unit === 'g' ? v / 1000 : v;\n      case 'heightCm': return unit === 'm' ? v * 100 : unit === 'in' ? v * 2.54 : unit === 'ft' ? v * 30.48 : v;\n      case 'wristTemp': return unit === 'degF' ? (v - 32) / 1.8 : v;\n      default: return v;\n    }\n  }\n\n  // ---------- dates ----------\n  // Health dates look like \"2026-10-19 07:20:00 +1100\". The day key is the local calendar day as recorded.\n  const dayOf = (s) => s.slice(0, 10);\n  function epoch(s) { // milliseconds since 1970 (UTC instant)\n    return Date.parse(`${s.slice(0, 10)}T${s.slice(11, 19)}${s.slice(20, 23)}:${s.slice(23, 25)}`);\n  }\n  function wallMs(s) { // the local wall-clock time, expressed as if it were UTC\n    return Date.parse(`${s.slice(0, 10)}T${s.slice(11, 19)}Z`);\n  }\n  const keyFromWall = (ms) => new Date(ms).toISOString().slice(0, 10);\n  const dayIndex = (k) => Math.round(Date.parse(k + 'T00:00:00Z') / DAY_MS);\n\n  // ---------- attribute reading ----------\n  function attr(tag, name) {\n    const i = tag.indexOf(' ' + name + '=\"');\n    if (i < 0) return null;\n    const s = i + name.length + 3;\n    return tag.slice(s, tag.indexOf('\"', s));\n  }\n  const unescapeXml = (s) => s.replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))\n    .replace(/&#(\\d+);/g, (_, d) => String.fromCodePoint(Number(d)))\n    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '\"').replace(/&apos;/g, \"'\").replace(/&amp;/g, '&');\n\n  // ---------- zip reading ----------\n  async function readBytes(blob, start, len) {\n    return new Uint8Array(await blob.slice(start, start + len).arrayBuffer());\n  }\n  async function findXmlInZip(blob) {\n    const size = blob.size;\n    const tailLen = Math.min(size, 65557 + 20);\n    const tail = await readBytes(blob, size - tailLen, tailLen);\n    const dv = new DataView(tail.buffer);\n    let eocd = -1;\n    for (let i = tail.length - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }\n    if (eocd < 0) throw new Error('This file is not a valid zip archive.');\n    let cdCount = dv.getUint16(eocd + 10, true), cdSize = dv.getUint32(eocd + 12, true), cdOffset = dv.getUint32(eocd + 16, true);\n    if (cdOffset === 0xffffffff || cdCount === 0xffff) { // Zip64\n      const loc = eocd - 20;\n      if (loc < 0 || dv.getUint32(loc, true) !== 0x07064b50) throw new Error('Unsupported zip format.');\n      const z64At = Number(dv.getBigUint64(loc + 8, true));\n      const z = new DataView((await readBytes(blob, z64At, 56)).buffer);\n      cdCount = Number(z.getBigUint64(32, true)); cdSize = Number(z.getBigUint64(40, true)); cdOffset = Number(z.getBigUint64(48, true));\n    }\n    const cd = await readBytes(blob, cdOffset, cdSize);\n    const c = new DataView(cd.buffer);\n    const dec = new TextDecoder();\n    const entries = [];\n    for (let p = 0, n = 0; n < cdCount && p + 46 <= cd.length; n++) {\n      if (c.getUint32(p, true) !== 0x02014b50) break;\n      const method = c.getUint16(p + 10, true);\n      let comp = c.getUint32(p + 20, true), uncomp = c.getUint32(p + 24, true);\n      const nameLen = c.getUint16(p + 28, true), extraLen = c.getUint16(p + 30, true), commentLen = c.getUint16(p + 32, true);\n      let local = c.getUint32(p + 42, true);\n      const name = dec.decode(cd.subarray(p + 46, p + 46 + nameLen));\n      // Zip64 extra field holds the real sizes and offset when the 32-bit ones are saturated.\n      let e = p + 46 + nameLen; const eEnd = e + extraLen;\n      while (e + 4 <= eEnd) {\n        const id = c.getUint16(e, true), sz = c.getUint16(e + 2, true);\n        if (id === 0x0001) {\n          let q = e + 4;\n          if (uncomp === 0xffffffff) { uncomp = Number(c.getBigUint64(q, true)); q += 8; }\n          if (comp === 0xffffffff) { comp = Number(c.getBigUint64(q, true)); q += 8; }\n          if (local === 0xffffffff) { local = Number(c.getBigUint64(q, true)); q += 8; }\n        }\n        e += 4 + sz;\n      }\n      entries.push({ name, method, comp, uncomp, local });\n      p += 46 + nameLen + extraLen + commentLen;\n    }\n    const xmls = entries.filter((x) => /\\.xml$/i.test(x.name) && !/cda/i.test(x.name));\n    const entry = xmls.find((x) => /(^|\\/)export\\.xml$/i.test(x.name)) || xmls.sort((a, b) => b.uncomp - a.uncomp)[0];\n    if (!entry) throw new Error('No export.xml found in this zip. Choose the export.zip from the Health app.');\n    const lh = new DataView((await readBytes(blob, entry.local, 30)).buffer);\n    if (lh.getUint32(0, true) !== 0x04034b50) throw new Error('The zip archive is damaged.');\n    const dataStart = entry.local + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);\n    if (entry.method !== 0 && entry.method !== 8) throw new Error('Unsupported compression in this zip.');\n    return { dataStart, comp: entry.comp, method: entry.method };\n  }\n\n  // ---------- main ----------\n  async function parseExport(blob, onProgress) {\n    const head = await readBytes(blob, 0, 4);\n    const isZip = head[0] === 0x50 && head[1] === 0x4b && head[2] === 0x03 && head[3] === 0x04;\n    // Progress counts input bytes (compressed bytes for a zip), measured before inflation.\n    let consumed = 0;\n    const counter = () => new TransformStream({ transform(chunk, ctl) { consumed += chunk.byteLength; ctl.enqueue(chunk); } });\n    let byteStream, total;\n    if (isZip) {\n      const z = await findXmlInZip(blob);\n      total = z.comp;\n      byteStream = blob.slice(z.dataStart, z.dataStart + z.comp).stream().pipeThrough(counter());\n      if (z.method === 8) {\n        if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot unzip files. Unzip the export first and choose export.xml, or update your browser.');\n        byteStream = byteStream.pipeThrough(new DecompressionStream('deflate-raw'));\n      }\n    } else {\n      total = blob.size;\n      byteStream = blob.stream().pipeThrough(counter());\n    }\n\n    const textStream = byteStream.pipeThrough(new TextDecoderStream());\n    const reader = textStream.getReader();\n\n    const st = {\n      exportDate: null, cutoffDay: null, me: {}, records: 0, used: 0,\n      hourly: new Map(), // key -> Map(hourKey -> Map(source -> value))\n      mean: new Map(), // key -> Map(day -> [sum, n])\n      last: new Map(), // key -> Map(day -> [epoch, value])\n      hr: new Map(), // day -> [sum, n, min, max]\n      mindful: new Map(), events: new Map(),\n      nights: new Map(), // nightKey -> Map(source -> [[start,end,stage]])\n      rings: new Map(), workouts: [], sources: new Map(),\n      firstDay: null, lastDay: null,\n    };\n\n    let buf = '';\n    let lastReport = 0;\n    for (;;) {\n      const { value, done } = await reader.read();\n      if (value) buf += value;\n      const cut = done ? buf.length : buf.lastIndexOf('>') + 1;\n      if (cut > 0) {\n        scan(buf.slice(0, cut), st);\n        buf = buf.slice(cut);\n      }\n      const now = Date.now();\n      if (onProgress && (now - lastReport > 200 || done)) {\n        lastReport = now;\n        onProgress({ phase: 'reading', done: consumed, total, records: st.records });\n      }\n      if (done) break;\n    }\n    if (onProgress) onProgress({ phase: 'building', done: total, total, records: st.records });\n    return finish(st);\n  }\n\n  const TAG_RE = /<(Record|ActivitySummary|Workout|Me|ExportDate)\\s([^>]*)>/g;\n  function scan(text, st) {\n    TAG_RE.lastIndex = 0;\n    let m;\n    while ((m = TAG_RE.exec(text))) {\n      const kind = m[1], t = ' ' + m[2];\n      if (kind === 'Record') { st.records++; record(t, st); }\n      else if (kind === 'ActivitySummary') summary(t, st);\n      else if (kind === 'Workout') workout(t, st);\n      else if (kind === 'Me') me(t, st);\n      else if (kind === 'ExportDate') {\n        const v = attr(t, 'value');\n        if (v) { st.exportDate = v; st.cutoffDay = keyFromWall(wallMs(v) - KEEP_DAYS * DAY_MS); }\n      }\n    }\n  }\n\n  function noteSource(st, t, type, day) {\n    const name = unescapeXml(attr(t, 'sourceName') || 'Unknown');\n    let s = st.sources.get(name);\n    if (!s) {\n      const dev = unescape
