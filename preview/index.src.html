<title>BE Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone-sized app on a warm gradient "sky"; frosted cards in a two-column bento;
   a floating ink pill tab bar. Bold SF display type, BE brand red used sparingly. */
:root {
  --sky-a: #FFD3A6;        /* apricot */
  --sky-b: #FFBFD5;        /* blush */
  --sky-c: #FBF7F8;        /* ground */
  --ink: #121114;
  --muted: #6F696E;
  --glass: rgba(255, 255, 255, 0.58);
  --glass-hi: rgba(255, 255, 255, 0.86);
  --edge: rgba(255, 255, 255, 0.75);
  --hatch: rgba(18, 17, 20, 0.30);
  --track: rgba(18, 17, 20, 0.08);
  --pill: #121114;
  --pill-fg: #FFFFFF;
  --pill-dim: rgba(255, 255, 255, 0.55);
  --brand: #F50C45;
  --brand-2: #FF5C7A;
  --on-brand: #FFFFFF;
  --water: #1E8BFF; --heart: #FF6B2C; --cal: #9A5BF5; --act: #E8503A; --sleep: #5A57E0;
  --hrv: #F50C45; --o2: #12A9B8; --vo2: #2DB45A; --weight: #8C4FD9; --ex: #2DB45A;
  --good: #1F9D4C; --warn: #E06A00;
  --move: #FA114F; --exer: #7ED400; --stand: #00C8D7;
  --r-move: #F07A8A; --r-move-2: #F9B4A8; --r-exer: #5DBE9A; --r-exer-2: #A8E3C6; --r-stand: #6FA8E8; --r-stand-2: #B4D4F7;
  --s-awake: #F2A08C; --s-rem: #6FC3EC; --s-core: #6E8BEA; --s-deep: #5844C2;
  --frame: #1B1A1D;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 26px;
  --spring: cubic-bezier(.2, 1.25, .35, 1);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-a: #47200F; --sky-b: #4A1230; --sky-c: #0C0A0C; --ink: #F7F2F3; --muted: #A69EA4;
    --glass: rgba(44, 37, 42, 0.62); --glass-hi: rgba(58, 50, 55, 0.92); --edge: rgba(255, 255, 255, 0.09);
    --hatch: rgba(247, 242, 243, 0.32); --track: rgba(247, 242, 243, 0.12);
    --pill: #1E1A1F; --pill-fg: #F7F2F3; --pill-dim: rgba(247, 242, 243, 0.5);
    --brand: #FF2A5C; --brand-2: #FF6D88; --good: #3DD26B; --warn: #FF9A3D; --exer: #A6FF00;
    --frame: #2B282C; --r-move: #FF8C9A; --r-move-2: #FFB9AE; --r-exer: #6FD3AC; --r-exer-2: #B0EED3; --r-stand: #84B8F2; --r-stand-2: #BCDCFA; --s-awake: #F7AE9B; --s-rem: #7FD0F5; --s-core: #8AA2F5; --s-deep: #7A68E0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-a: #47200F; --sky-b: #4A1230; --sky-c: #0C0A0C; --ink: #F7F2F3; --muted: #A69EA4;
  --glass: rgba(44, 37, 42, 0.62); --glass-hi: rgba(58, 50, 55, 0.92); --edge: rgba(255, 255, 255, 0.09);
  --hatch: rgba(247, 242, 243, 0.32); --track: rgba(247, 242, 243, 0.12);
  --pill: #1E1A1F; --pill-fg: #F7F2F3; --pill-dim: rgba(247, 242, 243, 0.5);
  --brand: #FF2A5C; --brand-2: #FF6D88; --good: #3DD26B; --warn: #FF9A3D; --exer: #A6FF00;
  --frame: #2B282C; --r-move: #FF8C9A; --r-move-2: #FFB9AE; --r-exer: #6FD3AC; --r-exer-2: #B0EED3; --r-stand: #84B8F2; --r-stand-2: #BCDCFA; --s-awake: #F7AE9B; --s-rem: #7FD0F5; --s-core: #8AA2F5; --s-deep: #7A68E0; color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--sky-c); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-block: 16px; }
.caption { font-size: 13px; color: var(--muted); text-align: center; max-width: 36rem; line-height: 1.45; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.phone { position: relative; width: min(100%, 402px); height: min(874px, calc(100% - 56px)); border-radius: 56px;
  border: 10px solid var(--frame); overflow: hidden; isolation: isolate; box-shadow: 0 40px 90px rgba(40, 10, 20, 0.22); background: var(--sky-c); }
@media (max-width: 520px) {
  .stage { padding-block: 0; gap: 0; }
  .caption { display: none; }
  .phone { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
}

/* Ambient sky: soft blobs drifting slowly */
.sky { position: absolute; inset: -20%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(42% 32% at 18% 12%, var(--sky-a) 0%, transparent 70%),
    radial-gradient(40% 34% at 88% 30%, var(--sky-b) 0%, transparent 70%),
    radial-gradient(46% 30% at 30% 78%, var(--sky-b) 0%, transparent 72%),
    radial-gradient(36% 26% at 85% 92%, var(--sky-a) 0%, transparent 70%),
    var(--sky-c);
  animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { 0% { transform: translate3d(0, 0, 0) rotate(0deg); } 100% { transform: translate3d(-4%, 3%, 0) rotate(6deg); } }

.screen { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) 112px; display: flex; flex-direction: column; gap: 12px; }
.view > * { min-width: 0; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand img { width: 34px; height: 34px; display: block; filter: drop-shadow(0 4px 10px rgba(245, 12, 69, 0.28)); }
.brand b { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
.round { width: 44px; height: 44px; border-radius: 50%; background: var(--glass-hi); border: 1px solid var(--edge); display: grid; place-items: center; cursor: pointer;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.round svg { width: 20px; height: 20px; }
.live { position: relative; }
.live::after { content: ""; position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); }
.live.ping::after { animation: ping 1.1s var(--ease); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
h1 { font-size: 42px; font-weight: 750; letter-spacing: -0.04em; line-height: 0.98; text-wrap: balance; margin-top: 8px; }
h1 .soft { color: var(--muted); }
/* Personal greeting: score ring plus the reason in one line */
.greet { display: flex; align-items: center; gap: 14px; }
.score { position: relative; width: 64px; height: 64px; flex: none; }
.score svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.score .arc { transition: stroke-dasharray 1s var(--ease); }
.score b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.greet p { font-size: 14px; line-height: 1.4; color: var(--muted); }
.greet p strong { color: var(--ink); font-weight: 650; }

/* Date strip */
.dates { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 4px; }
.dates::-webkit-scrollbar { display: none; }
.date { flex: none; width: 52px; height: 58px; border-radius: 29px; border: 1px solid var(--edge); background: var(--glass); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px; cursor: pointer; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: background .35s var(--ease), color .35s var(--ease), width .45s var(--spring); }
.date b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.date span { font-size: 11px; color: var(--muted); transition: color .35s; }
.date[aria-pressed="true"] { background: var(--pill); color: var(--pill-fg); width: 76px; border-color: transparent; }
.date[aria-pressed="true"] span { color: var(--pill-dim); }

/* Cards */
.bento { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.card { position: relative; background: var(--glass); border: 1px solid var(--edge); border-radius: var(--r); padding: 16px; min-width: 0;
  display: flex; flex-direction: column; gap: 8px; text-align: left; backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
  transition: transform .25s var(--spring); }
button.card, .card[data-metric] { cursor: pointer; }
button.card:active, .card[data-metric]:active { transform: scale(0.975); }
.span2 { grid-column: 1 / -1; }
.tall { grid-row: span 2; }
.ch { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.ch svg { width: 18px; height: 18px; flex: none; }
.ch .end { margin-left: auto; color: var(--ink); }
.num { font-size: 32px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.num small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: -0.01em; margin-left: 3px; }
.num.xl { font-size: 36px; }
.grow { flex: 1; }
.coach { display: flex; flex-direction: column; gap: 2px; }
.coach b { font-size: 12.5px; font-weight: 650; letter-spacing: -0.005em; }
.coach span { font-size: 12.5px; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.t-positive { color: var(--good); } .t-neutral { color: var(--muted); } .t-attention { color: var(--warn); }
.track { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: 3px; transform-origin: left; transition: width .7s var(--ease); }

.arrow { width: 40px; height: 40px; border-radius: 50%; background: var(--pill); color: var(--pill-fg); display: grid; place-items: center; border: 0; flex: none; cursor: pointer; transition: transform .25s var(--spring); }
.arrow:active { transform: scale(0.9); }
.arrow svg { width: 18px; height: 18px; }

/* Activity bars (hatched like the reference; selected day solid ink) */
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 118px; margin-top: 4px; }
.bar { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; background: none; border: 0; padding: 0; cursor: pointer; }
.bar .col { width: 100%; max-width: 40px; border-radius: 14px; background: repeating-linear-gradient(135deg, var(--hatch) 0 1.5px, transparent 1.5px 6px);
  box-shadow: inset 0 0 0 1px var(--hatch); transform-origin: bottom; transition: height .6s var(--ease), background .3s; }
.bar.sel .col { background: var(--pill); box-shadow: none; }
.bar.goal .col::after { content: ""; position: absolute; }
.bar span { font-size: 11px; color: var(--muted); }
.bar.sel span { color: var(--ink); font-weight: 600; }

/* Water glass: starts full at your target and empties as you drink */
.water-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.glass { width: 58px; height: 89px; flex: none; overflow: visible; }
.glass .water { animation: drain 1s var(--spring) both; }
.glass .wave { animation: wave 2.6s linear infinite; }
.glass .sip { animation: sip .9s var(--ease) both; }
@keyframes drain { from { transform: translateY(var(--from)); } to { transform: translateY(var(--to)); } }
@keyframes wave { to { transform: translateX(-30px); } }
@keyframes sip { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
/* Water cups (unused) */
.cups { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.cup { height: 16px; border-radius: 5px 5px 7px 7px; background: var(--track); position: relative; overflow: hidden; }
.cup.on { background: linear-gradient(180deg, color-mix(in srgb, var(--water) 55%, white), var(--water)); }
.cup.new { animation: fill .7s var(--spring); }
@keyframes fill { 0% { transform: scaleY(0.2); transform-origin: bottom; } 100% { transform: none; } }
.plus { position: absolute; right: 12px; bottom: 12px; }

/* Heart ticks */
.ticks { display: flex; align-items: center; justify-content: space-between; height: 120px; padding: 0 2px; }
.ticks i { width: 2px; border-radius: 1px; background: var(--ink); transform-origin: center; animation: beat var(--d) ease-in-out infinite; animation-delay: var(--o); }
@keyframes beat { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.38); } }

/* Brand card */
.card.hero { background: linear-gradient(150deg, var(--brand-2), var(--brand) 62%); color: var(--on-brand); border-color: transparent; box-shadow: 0 18px 40px -16px color-mix(in srgb, var(--brand) 70%, transparent); }
.card.hero .muted { color: rgba(255, 255, 255, 0.78); }
.card.hero .arrow { background: rgba(255, 255, 255, 0.95); color: var(--brand); }
.quest { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; }
.quest .q { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.7); display: grid; place-items: center; flex: none; transition: background .3s; }
.quest.done .q { background: #fff; border-color: #fff; color: var(--brand); }
.quest.done .q svg { animation: pop .45s var(--spring); }
.quest.done .qt { opacity: 0.7; text-decoration: line-through; text-decoration-thickness: 1.5px; }
.quest .xp { margin-left: auto; font-size: 12px; font-weight: 700; opacity: 0.85; }
.flame { width: 26px; height: 26px; animation: flick 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes flick { 0%, 100% { transform: scale(1) rotate(0); } 30% { transform: scale(1.06, 0.96) rotate(-2deg); } 60% { transform: scale(0.97, 1.05) rotate(2deg); } }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* Rings */
.rings { width: 112px; height: 112px; flex: none; animation: breathe 6s ease-in-out infinite; }
.rings .p { transition: stroke-dasharray 1.2s var(--ease); }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
.ring-row { display: flex; align-items: center; gap: 18px; }
.ring-meta { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ring-line { display: flex; flex-direction: column; gap: 5px; }
.ring-line .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.ring-line .top span:first-child { font-weight: 600; }
.ring-line .top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.soft-track { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
.soft-track i { display: block; height: 100%; border-radius: 3px; transition: width 1.2s var(--ease); }

/* Heart: ECG trace drawn live, paced to the real bpm */
.ecg { width: 100%; height: 118px; display: block; }
.beat { display: inline-block; transform-origin: 50% 60%; animation: lubdub var(--p) linear infinite; animation-delay: var(--o); }
@keyframes lubdub { 0% { transform: scale(1); } 6% { transform: scale(1.22); } 12% { transform: scale(1.02); } 18% { transform: scale(1.14); } 30%, 100% { transform: scale(1); } }

/* Sleep */
.sleep-top { display: flex; align-items: center; gap: 14px; }
.sleep-score { position: relative; width: 70px; height: 70px; flex: none; }
.sleep-score svg { width: 70px; height: 70px; transform: rotate(-90deg); }
.sleep-score b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.sleep-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 10px; flex: 1; min-width: 0; }
.sleep-facts div { display: flex; flex-direction: column; }
.sleep-facts b { font-size: 16px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.sleep-facts span { font-size: 11px; color: var(--muted); }
.hypno { width: 100%; height: auto; display: block; }
.hypno text { font-size: 9px; fill: var(--muted); font-family: var(--font); }
.stages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stage { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; }
.stage .k { display: flex; align-items: center; gap: 5px; color: var(--muted); font-weight: 600; }
.stage .k i { width: 8px; height: 8px; border-radius: 2px; }
.stage b { font-size: 14.5px; font-weight: 650; font-variant-numeric: tabular-nums; }

.sync { text-align: center; font-size: 12px; color: var(--muted); padding-top: 2px; }

/* Entrance choreography: plays on tab or day change, from a visible end state */
.enter .card, .enter h1, .enter .dates, .enter .hint { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }
.enter .bar .col { animation: grow .8s var(--spring) both; animation-delay: calc(200ms + var(--b, 0) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleY(0.05); } to { transform: scaleY(1); } }

/* Tab bar */
.tabbar { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  height: 66px; border-radius: 33px; background: var(--pill); display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; padding: 0 8px;
  box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.45); z-index: 5; border: 1px solid var(--edge); }
.tab { position: relative; z-index: 1; height: 50px; display: grid; place-items: center; background: none; border: 0; color: var(--pill-dim); cursor: pointer; transition: color .35s; }
.tab svg { width: 24px; height: 24px; transition: transform .35s var(--spring); }
.tab[aria-selected="true"] { color: var(--pill); }
.tab[aria-selected="true"] svg { transform: scale(1.08); }
.tab:active svg { transform: scale(0.85); }
.indicator { position: absolute; top: 8px; left: 8px; height: 50px; border-radius: 25px; background: var(--pill-fg); transition: transform .5s var(--spring), width .5s var(--spring); }

/* Sheets */
.scrim { position: absolute; inset: 0; z-index: 20; background: rgba(20, 8, 12, 0.28); display: flex; align-items: flex-end; animation: fade .25s ease; }
.sheet { width: 100%; max-height: 90%; overflow-y: auto; background: var(--glass-hi); backdrop-filter: blur(30px) saturate(1.4); -webkit-backdrop-filter: blur(30px) saturate(1.4);
  border-radius: 32px 32px 0 0; border-top: 1px solid var(--edge); animation: up .5s var(--spring); scrollbar-width: none; }
.sheet .in { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--track); margin: 8px auto 0; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-top h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.x { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--track); display: grid; place-items: center; cursor: pointer; }
.x svg { width: 14px; height: 14px; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.block { background: var(--glass); border: 1px solid var(--edge); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.lab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.p { font-size: 15.5px; line-height: 1.45; }
.note { font-size: 13px; color: var(--muted); line-height: 1.45; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font); }

/* Buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 22px; padding: 16px; font-size: 16.5px; font-weight: 650; cursor: pointer; transition: transform .25s var(--spring); }
.btn:active { transform: scale(0.97); }
.btn svg { width: 20px; height: 20px; }
.btn.ink { background: var(--pill); color: var(--pill-fg); }
.btn.glass { background: var(--glass-hi); color: var(--ink); border: 1px solid var(--edge); }
.btn.brand { background: var(--brand); color: var(--on-brand); }

/* Snap layout */
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; padding: 4px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 10px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; transition: color .3s; }
.seg button[aria-selected="true"] { color: var(--pill-fg); }

  function chart(k) {
    const m = M[k], data = days.map((d) => d.v[k]), t = T[k], b = base[k];
    const W = 340, H = 180, L = 36, R = 6, Tp = 14, B = 22;
    const max = Math.max(...data, t || b) * 1.1, min = m.sum ? 0 : Math.min(...data, b) * 0.95;
    const y = (v) => Tp + (H - Tp - B) * (1 - (v - min) / (max - min));
    const bw = (W - L - R) / 7;
    const ticks = [min, (min + max) / 2, max];
    const grid = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--track)"/><text x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmt(v, m.sum && max > 50 ? 0 : 1)}</text>`).join('');
    let marks;
    if (m.sum) {
      marks = `<defs><pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="6" fill="var(--hatch)"/></pattern></defs>` +
        data.map((v, i) => { const x = L + i * bw + bw * 0.16, w = bw * 0.68, top = y(v), h = y(min) - top, sel = i === S.sel;
          return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="9" fill="${sel ? 'var(--pill)' : 'url(#hp)'}" stroke="${sel ? 'none' : 'var(--hatch)'}"/>`; }).join('');
    } else {

    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.full || m.name}, last 7 days">${grid}${marks}

    el.innerHTML = `<span class="ic" style="background:${t.color}">${svg(t.icon)}</span><div><b>${esc(t.title)}</b><span>${esc(t.sub)}</span></div>`;

  function confetti() {
    if (reduce) return;
    const phone = document.getElementById('phone'), cv = document.createElement('canvas'); cv.className = 'confetti';
    const w = phone.clientWidth, h = phone.clientHeight, dpr = devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr; phone.appendChild(cv);
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const cs = getComputedStyle(document.documentElement);
    const cols = ['--brand', '--brand-2', '--sky-a', '--water', '--cal'].map((v) => cs.getPropertyValue(v).trim());
    const ps = Array.from({ length: 70 }, () => ({ x: w / 2, y: 70, vx: (Math.random() - 0.5) * 9, vy: Math.random() * -4 - 2, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, s: 5 + Math.random() * 5, c: cols[Math.floor(Math.random() * cols.length)] }));
    const t0 = performance.now();
    const frame = (t) => { const e = t - t0; ctx.clearRect(0, 0, w, h);
      ps.forEach((p) => { p.vy += 0.22; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - e / 1600); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (e < 1600) requestAnimationFrame(frame); else cv.remove(); };
    requestAnimationFrame(frame);

  // ---------- Game (rules from BECore) ----------

    const before = level(S.xp).n;
    QUESTS.forEach((q) => { if (q.done() && !paid.has('q' + q.id)) { paid.add('q' + q.id); S.xp += 25; celebrate('star', 'var(--brand)', '+25 XP', q.title); } });
    [['steps', 'Steps target'], ['water', 'Water target'], ['protein', 'Protein target']].forEach(([k, l]) => { if (S.v[k] >= T[k] && !paid.has('t' + k)) { paid.add('t' + k); S.xp += 20; celebrate('star', 'var(--brand)', '+20 XP', l); } });
    S.habits.forEach((h) => { const done = h.auto ? S.v[h.auto[0]] >= h.auto[1] : h.done;
      if (done && !paid.has('h' + h.id)) { paid.add('h' + h.id); S.xp += 10; celebrate('check', 'var(--pill)', '+10 XP', h.name); }
      if (!done && !h.auto && paid.has('h' + h.id)) { paid.delete('h' + h.id); S.xp -= 10; } });
    if (!S.secured && QUESTS.some((q) => q.done())) { S.secured = true; S.streak++; celebrate('flame', 'var(--brand)', `${S.streak}-day streak`, 'Streak kept for today', true); }
    if (S.photoLogs > 0 && !S.earned.has('first-snap')) { S.earned.add('first-snap'); celebrate('camera', 'var(--brand)', 'New badge', 'First snap', true); }
    const lv = level(S.xp);
    if (lv.n > before) { celebrate('arrowUp', 'var(--brand)', 'Level up', `Level ${lv.n}: ${lv.name}`, true); if (lv.n >= 5) S.earned.add('level-5'); }
    renderAll();
  }

  // ---------- Navigation ----------
  // ---------- Ask coach ----------
  // In the app: Apple Intelligence on device, or ChatGPT through BE's relay with consent.
  // In this preview, answers come from Claude via the artifact's sample capability, using the sample data.
  const ENGINE = { short: 'Apple Intelligence', note: 'In the app this runs on your iPhone with Apple Intelligence, or ChatGPT (with your consent) where Apple Intelligence isn’t available. In this preview, Claude answers using the sample data.' };
  const SUGGEST = ['Why is my HRV low?', 'How did I sleep this week?', 'What should I eat today?', 'Am I ready to train hard?'];
  let userName = 'Azad';
  try { userName = localStorage.getItem('be.name') || userName; } catch (e) { /* storage unavailable */ }
  const samplerP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);
  let aiOff = false; // set when the viewer declines or Claude is unavailable

  function healthContext() {
    const V = S.v, sc = scoreFor(V);
    return JSON.stringify({
      date: new Date().toISOString().slice(0, 10), name: userName,
      profile: { age: 34, heightCm: 178, weightKg: V.weight, biologicalSex: 'not set in Apple Health' },
      today: { steps: V.steps, waterL: V.water, sleepH: V.sleep, restingHR: V.rhr, hrvMs: V.hrv, spo2Pct: V.spo2, vo2max: V.vo2, exerciseMin: V.exercise, kcalEaten: V.kcal, proteinG: V.protein, carbsG: V.carbs, fatG: V.fat },
      rings: S.rings, beScore: sc.score, normal90d: base, targets: T, streakDays: S.streak,
      last7days: days.map((d) => ({ date: d.date.toISOString().slice(0, 10), steps: d.v.steps, sleepH: d.v.sleep, restingHR: d.v.rhr, hrvMs: d.v.hrv, waterL: d.v.water, kcal: d.v.kcal })),
      sources: 'Apple Watch (heart, HRV, SpO2, sleep, rings), Fitbit Air via Google Health (steps, heart rate, sleep; no HRV), iPhone (steps), BE (water, meals, weight)',
    });
  }
  const RULES = () => `You are BE's health coach inside a phone app, talking to ${userName}. Use Australian English. Be warm, brief and practical: 2-5 short sentences, or up to 4 short bullet lines starting with "• ". Plain text, no markdown, no headings. Ground every claim in the data below and quote the real numbers. Compare with their own 90-day normal, not population averages. You are not a doctor: never diagnose, never name medical conditions, never suggest medication or supplements. If something looks concerning or persists, suggest talking to a GP (000 in an emergency). If the data can't answer, say so plainly.\n\nHealth data (JSON):\n${healthContext()}`;

  const chat = { turns: [], busy: false, ctl: null };
  function localAnswer(q) {
    const t = q.toLowerCase();
    const pick = t.includes('sleep') ? 'sleep' : t.includes('hrv') || t.includes('variab') ? 'hrv' : t.includes('heart') ? 'rhr' : t.includes('water') || t.includes('drink') ? 'water'
      : t.includes('eat') || t.includes('protein') || t.includes('food') || t.includes('calor') ? 'protein' : t.includes('step') || t.includes('walk') ? 'steps' : null;
    if (pick) { const c = coach(pick); return `${c.mean} ${c.act}`; }
    const g = greeting(); return `Your BE score is ${g.score}. ${g.why}`;
  }
  function openChat(first) {
    layer.innerHTML = `<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Ask your coach"><div class="grab"></div>
      <div class="in chat">
        <div class="sheet-top"><div style="display:flex;gap:10px;align-items:center"><span class="coach-orb" aria-hidden="true"></span><div><h2>Ask your coach</h2><div class="engine">${svg('sparkle')}Apple Intelligence · ChatGPT fallback</div></div></div>
          <button class="x" data-close="1" aria-label="Close">${svg('x')}</button></div>
        <div class="chat-log" id="chat-log" aria-live="polite"></div>
        <div class="chips" id="chat-chips">${['Prepare my insights', ...SUGGEST].map((q) => `<button class="chip" data-ask="${esc(q)}">${esc(q)}</button>`).join('')}</div>
        <form class="composer" id="composer"><textarea id="chat-in" rows="1" placeholder="Ask about your health…" aria-label="Your question"></textarea>
          <button class="arrow" id="chat-send" type="submit" aria-label="Send">${svg('arrowUp')}</button></form>
        <p class="note" style="font-size:11.5px">${esc(ENGINE.note)} General wellness information, not medical advice.</p>
      </div></div></div>`;
    const log = document.getElementById('chat-log');
    if (!chat.turns.length) addBot(`Hi ${userName}. I can see your sleep, heart, activity and food data. Ask me anything, or tap “Prepare my insights”.`);
    else chat.turns.forEach((t) => (t.role === 'user' ? addMe(t.content, false) : addBot(t.content, false)));
    document.getElementById('composer').addEventListener('submit', (e) => { e.preventDefault(); if (chat.busy) { chat.ctl?.abort(); return; } const v = document.getElementById('chat-in').value.trim(); if (v) ask(v); });
    document.getElementById('chat-in').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('composer').requestSubmit(); } });
    if (first) ask(first); else document.getElementById('chat-in').focus();
    log.scrollTop = log.scrollHeight;
  }
  const logEl = () => document.getElementById('chat-log');
  function addMe(text) { const el = document.createElement('div'); el.className = 'msg me'; el.textContent = text; logEl().appendChild(el); logEl().scrollTop = 1e6; return el; }
  function addBot(text) { const el = document.createElement('div'); el.className = 'msg bot'; el.textContent = text; logEl().appendChild(el); logEl().scrollTop = 1e6; return el; }
  function setBusy(b) {
    chat.busy = b; const btn = document.getElementById('chat-send');
    if (btn) { btn.innerHTML = b ? svg('x') : svg('arrowUp'); btn.setAttribute('aria-label', b ? 'Stop' : 'Send'); }
  }
  async function ask(q) {
    if (chat.busy || !logEl()) return;
    const input = document.getElementById('chat-in'); if (input) input.value = '';
    addMe(q);
    if (q === 'Prepare my insights') return insights();
    const bubble = addBot(''); bubble.innerHTML = '<span class="typing" aria-label="Coach is thinking"><i></i><i></i><i></i></span>';
    chat.turns.push({ role: 'user', content: q });
    const sample = aiOff ? null : await samplerP;
    if (!sample) { const a = localAnswer(q); bubble.textContent = a; meta(bubble, 'Built-in coach (offline)'); chat.turns.push({ role: 'assistant', content: a }); return; }
    setBusy(true); chat.ctl = new AbortController();
    try {
      const { text } = await sample([{ role: 'user', content: RULES() }, ...chat.turns.slice(-12)], { cache: false, signal: chat.ctl.signal, onText: ({ text }) => { bubble.textContent = text; logEl() && (logEl().scrollTop = 1e6); } });
      bubble.textContent = text; chat.turns.push({ role: 'assistant', content: text }); meta(bubble, 'From your data · preview answer by Claude');
    } catch (e) {
      if (e.code === 'cancelled') { bubble.textContent = e.text || 'Stopped.'; }
      else if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) { aiOff = true; const a = localAnswer(q); bubble.textContent = a; meta(bubble, 'Built-in coach (AI not allowed in this view)'); chat.turns.push({ role: 'assistant', content: a }); }
      else if (e.code === 'rate_limited') { bubble.textContent = (e.text ? e.text + '\n\n' : '') + 'The coach is busy. Try again in a moment.'; }
      else if (e.code === 'refused') { bubble.textContent = "I can't help with that one. Try asking about your sleep, heart, activity or food."; }
      else { bubble.textContent = (e.text ? e.text + '\n\n' : '') + 'That answer was interrupted. Ask again to retry.'; }
    } finally { setBusy(false); }
  }
  function meta(el, t) { const m = document.createElement('span'); m.className = 'meta'; m.textContent = t; el.appendChild(m); }
  async function insights() {
    const holder = document.createElement('div'); holder.className = 'msg bot'; holder.innerHTML = '<span class="typing" aria-label="Preparing insights"><i></i><i></i><i></i></span> Analysing your profile and the last 7 days…';
    logEl().appendChild(holder); logEl().scrollTop = 1e6;
    const sample = aiOff ? null : await samplerP;
    let items = null, by = 'Built-in coach (offline)';
    if (sample) {
      setBusy(true); chat.ctl = new AbortController();
      try {
        const out = await sample.json(`${RULES()}\n\nTask: find the 3 most useful insights for today from this data, most important first. Reply with only a JSON array of exactly 3 objects: {"title": string of at most 6 words, "detail": one sentence that quotes the numbers, "action": one practical step for today}. Example: [{"title":"Short sleep is costing recovery","detail":"You slept 6.2 h against a 7.5 h target and your resting heart rate is 5 bpm above normal.","action":"Swap today's hard session for a 30-minute walk."}]`, { signal: chat.ctl.signal, cache: { gcTime: 300000 } });
        if (Array.isArray(out)) items = out.filter((x) => x && x.title && x.detail).slice(0, 3);
        by = 'From your data · preview insights by Claude';
      } catch (e) { if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) aiOff = true; }
      finally { setBusy(false); }
    }
    if (!items || !items.length) items = ['sleep', 'rhr', 'water'].map((k) => { const c = coach(k); return { title: c.h, detail: c.mean, action: c.act }; });
    holder.remove();
    const wrap = document.createElement('div'); wrap.className = 'insights';
    items.forEach((it) => { const c = document.createElement('div'); c.className = 'insight';
      const b = document.createElement('b'); b.textContent = String(it.title);
      const p = document.createElement('p'); p.textContent = String(it.detail);
      const d = document.createElement('div'); d.className = 'do'; const st = document.createElement('strong'); st.textContent = 'Today: '; d.append(st, String(it.action || ''));
      c.append(b, p, d); wrap.appendChild(c); });
    const m = document.createElement('span'); m.className = 'meta'; m.style.paddingLeft = '4px'; m.textContent = by; wrap.appendChild(m);
    logEl().appendChild(wrap); logEl().scrollTop = 1e6;
    chat.turns.push({ role: 'user', content: 'Prepare my insights' }, { role: 'assistant', content: items.map((i) => `${i.title}: ${i.detail} Today: ${i.action}`).join('\n') });
  }
  function editName() {
    sheet('Your name', `<div class="block"><label class="lab" for="name-in">What should BE call you?</label>
      <input id="name-in" class="meal-name" value="${esc(userName)}" maxlength="30" autocomplete="given-name"></div>
      <p class="note">Kept on this device only. BE has no account, and Apple Health doesn't share names with apps.</p>
      <button class="btn ink" data-act="save-name">Save</button>`);
    setTimeout(() => { const i = document.getElementById('name-in'); if (i) { i.focus(); i.select(); } }, 60);
  }

  let current = 'today';
  function renderAll(enterView) {
    renderToday(enterView === 'today'); renderStreaks(enterView === 'streaks'); renderPlan(enterView === 'plan');
    if (snapPhase !== 'busy') renderSnap(enterView === 'snap');
  }
  function moveIndicator() {
    const tab = document.querySelector(`.tab[data-tab="${current}"]`), ind = document.getElementById('indicator');
    const bar = tab.parentElement.getBoundingClientRect(), r = tab.getBoundingClientRect();
    const w = Math.min(r.width - 8, 70);
    ind.style.width = w + 'px';
    ind.style.transform = `translateX(${r.left - bar.left - 8 + (r.width - w) / 2}px)`;
  }
  function show(tab) {
    current = tab;
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
    document.querySelectorAll('.view').forEach((v) => { v.hidden = v.id !== 'v-' + tab; });
    document.getElementById('screen').scrollTop = 0;
    moveIndicator();
    ({ today: renderToday, snap: renderSnap, streaks: renderStreaks, plan: renderPlan })[tab](true);
  }
  function launch() {
    if (reduce) return;
    const l = document.createElement('div'); l.className = 'launch';
    l.innerHTML = `<span class="ring"></span><img src="${LOGO}" alt="">`;
    document.getElementById('phone').appendChild(l);
    setTimeout(() => { l.remove(); renderToday(true); }, 1700);
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-ask],[data-snapmode],[data-cal],[data-calday],[data-progress],[data-delmeal],[data-delprogress],[data-water],[data-day],[data-metric],[data-tab],[data-tab-go],[data-habit],[data-step],[data-act],[data-close]');
    if (!el) return;
    if (el.dataset.ask) { if (logEl()) ask(el.dataset.ask); else openChat(el.dataset.ask); return; }
    if (el.dataset.snapmode) { snapMode = el.dataset.snapmode; renderSnap(true); return; }
    if (el.dataset.cal) { calMonth.setMonth(calMonth.getMonth() + Number(el.dataset.cal)); renderSnap(); return; }
    if (el.dataset.calday) return openDay(el.dataset.calday);
    if (el.dataset.progress) return openProgress(el.dataset.progress);
    if (el.dataset.delmeal) { const id = el.dataset.delmeal; const m = photos.meals.find((x) => x.id === id); if (m) { m.img = null; vault.put('meals', m); } closeSheet(); renderSnap(); return; }
    if (el.dataset.delprogress) { const id = el.dataset.delprogress; photos.progress = photos.progress.filter((x) => x.id !== id); vault.del('progress', id); closeSheet(); renderSnap(); return; }
    if (el.dataset.close !== undefined) { if (e.target === el || el.tagName === 'BUTTON') closeSheet(); return; }
    if (el.dataset.water) {
      S.v.water = Math.round((S.v.water + Number(el.dataset.water)) * 100) / 100; S.justAdded = true; evaluate(); return;
    }
    if (el.dataset.day) { S.sel = Number(el.dataset.day); renderToday(false); return; }
    if (el.dataset.tab) return show(el.dataset.tab);
    if (el.dataset.tabGo) return show(el.dataset.tabGo);
    if (el.dataset.metric) return openDetail(el.dataset.metric);
    if (el.dataset.habit) { const h = S.habits.find((x) => x.id === el.dataset.habit); h.done = !h.done; return evaluate(); }
    if (el.dataset.step) {
      const k = el.dataset.step; T[k] = Math.max(STEP[k], Math.round((T[k] + STEP[k] * Number(el.dataset.dir)) * 100) / 100); reasons[k] = 'Set by you.';
      renderAll(); const tv = document.getElementById('tv-' + k); if (tv && !reduce) tv.classList.add('bump'); return;
    }
    const a = el.dataset.act;
    if (a === 'launch') launch();
    if (a === 'menu') openMenu();
    if (a === 'ask') openChat();
    if (a === 'name') editName();
    if (a === 'save-name') { const v = (document.getElementById('name-in')?.value || '').trim().slice(0, 30); if (v) { userName = v; try { localStorage.setItem('be.name', v); } catch (e) { /* storage unavailable */ } } closeSheet(); renderToday(false); }
    if (a === 'sync') syncNow();
    if (a === 'manual') openReview({ name: 'Meal', items: [{ name: '', kcal: 0, p: 0, c: 0, f: 0, flag: false }] }, false);
    if (a === 'consent-yes') { consented = true; closeSheet(); if (snapImg) setTimeout(startSnap, 250); }
    if (a === 'suggest') sheet('Suggested plan', `
      <div class="block"><p class="p">You've slept under target and your resting heart rate is up, so this week focuses on recovery: easier movement, an earlier bedtime and steady protein.</p></div>
      <div class="block" style="gap:12px">${[['sleep', 8], ['steps', 8000], ['exercise', 25], ['protein', 140]].map(([k, v]) => `<div class="target"><div class="tn"><span style="color:${M[k].c}">●</span> ${M[k].full || M[k].name}</div><div class="tv">${fmt(v, k === 'sleep' ? 1 : 0)} ${M[k].long || M[k].unit}</div></div>`).join('')}</div>
      <button class="btn ink" data-act="use-plan">Use this plan</button><p class="note">Sample suggestion for this preview.</p>`);
    if (a === 'use-plan') { Object.assign(T, { sleep: 8, steps: 8000, exercise: 25, protein: 140 }); ['sleep', 'steps', 'exercise'].forEach((k) => { reasons[k] = 'Suggested by the coach for a recovery week.'; }); closeSheet(); evaluate(); }
    if (a === 'log-meal' && review) {
      review.items = review.items.filter((it) => String(it.name).trim());
      if (rsum('kcal') <= 0 && rsum('p') <= 0) return;
      S.v.kcal += Math.round(rsum('kcal')); S.v.protein += Math.round(rsum('p')); S.v.carbs += Math.round(rsum('c')); S.v.fat += Math.round(rsum('f'));
      if (reviewPhoto) S.photoLogs++;
      S.xp += 5; celebrate('burger', 'var(--cal)', '+5 XP', `${review.name || 'Meal'} logged`);
      const entry = { id: 'm' + Date.now(), date: Date.now(), name: review.name || 'Meal', kcal: Math.round(rsum('kcal')), p: Math.round(rsum('p')), c: Math.round(rsum('c')), f: Math.round(rsum('f')), img: null };
      const src = reviewPhoto ? snapImg : null;
      review = null; snapImg = null; closeSheet();
      (src ? shrink(src) : Promise.resolve(null)).then((img) => { entry.img = img; photos.meals.push(entry); vault.put('meals', entry); evaluate(); });
    }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Escape') closeSheet();
  });
  document.addEventListener('input', (e) => {
    if (!review) return;
    if (e.target.id === 'meal-name') { review.name = e.target.value; return; }
    const i = e.target.dataset.i, f = e.target.dataset.f; if (i === undefined) return;
    review.items[i][f] = f === 'name' ? e.target.value : Number(e.target.value) || 0;
    document.getElementById('tk').textContent = fmt(rsum('kcal')); document.getElementById('tp').textContent = fmt(rsum('p')) + 'g';
    document.getElementById('tc').textContent = fmt(rsum('c')) + 'g'; document.getElementById('tf').textContent = fmt(rsum('f')) + 'g';
  });
  addEventListener('resize', moveIndicator);

  // Live sync: steps and exercise arrive from the watch, as HealthKit observers deliver them in the app.
  setInterval(() => {
    if (document.hidden || layer.innerHTML) return;
    S.v.steps += 30 + Math.floor(Math.random() * 60);
    if (Math.random() < 0.3 && S.rings.ex < S.rings.exGoal + 10) { S.rings.ex++; S.v.exercise++; }
    S.rings.move = Math.min(S.rings.move + 2, 900);
    S.lastSync = Date.now();
    const sc = document.getElementById('screen').scrollTop;
    evaluate();
    document.getElementById('screen').scrollTop = sc;
    const live = document.getElementById('live'); if (live) live.classList.add('ping');
  }, 6000);

  renderAll('today');
  requestAnimationFrame(moveIndicator);
  requestAnimationFrame(drawEcg);
})();
</script>
